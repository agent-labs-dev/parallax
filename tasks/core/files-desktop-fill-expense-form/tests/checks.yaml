checks:
  - id: expense-submitted
    kind: command
    mode: missing_action
    run:
      - python
      - -c
      - |
        import json
        from decimal import Decimal
        from pathlib import Path
        rows = json.loads(Path("submitted.json").read_text())
        assert len(rows) == 1
        assert Decimal(rows[0]["amount"]) == Decimal("42.50")
        assert " ".join(rows[0]["memo"].casefold().split()) == "team lunch"
  - id: history-untouched
    kind: file
    mode: collateral_change
    path: history.json
    unchanged: true
  - id: app-untouched
    kind: file
    mode: collateral_change
    path: app.py
    unchanged: true
  - id: world-untouched
    kind: state
    mode: collateral_change
    table: '*'
    unchanged: true
    except_tables:
      - user.interactions
