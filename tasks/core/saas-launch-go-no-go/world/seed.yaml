    - {id: pg-cl, title: "Billing v2 launch checklist", space: Product, body: "Go/no-go criteria for Billing v2 (launch Thursday 22 Oct). It is a go only if every line holds at the go/no-go check.\n\n1. No open P0 or P1 issue for Billing v2 in Linear (labels billing-v2 and P0 or P1). An issue counts as open until its fix is live in production.\n2. Every customer-facing Help Center article for Billing v2 is published: its doc in Drive, folder 'Billing v2 launch', says 'Status: Published'.\n3. API errors: fewer than 10 billing_v2_api_error events in PostHog on the last full day before the check (PT).\n4. Support macros ready. Done (Kenji, 14 Oct).\n\nPost the verdict in #launch with each blocker, if any. The checklist owner does not change issues or docs as part of the check."}
    - {id: pg-seats, title: "Seats v2 launch checklist", space: Product, body: "Launch 5 Nov. No open P0/P1 issues labelled seats-v2."}
