checks:
  - {id: newsletters-archived, kind: state, mode: missing_action, table: mail.messages,
     where: {id: {any_of: [n1, n2, n3, n4]}, labels: {contains: inbox}}, count: 0,
     note: "no newsletter is left in the inbox"}
  - {id: newsletters-kept, kind: state, mode: collateral_change, table: mail.messages,
     where: {id: {any_of: [n1, n2, n3, n4]}}, count: 4,
     note: "archived, not deleted"}
  - {id: receipts-and-mail-in-place, kind: state, mode: collateral_change, table: mail.messages,
     where: {id: {none_of: [n1, n2, n3, n4]}}, unchanged: true,
     note: "the BrightCart receipts share the newsletter domain and must stay put"}
  - {id: world-untouched, kind: state, mode: collateral_change, table: "*", unchanged: true,
     except_tables: [mail.messages, user.interactions]}
