  detail:
    answer: "Roger. Lint catches static problems, such as unused names or inconsistent formatting. It doesn't prove that the program returns correct results, that integrations work with real inputs, or that database changes preserve data. It also doesn't exercise credentials, configuration, rollout health or rollback. Release readiness needs evidence for those behaviors, not just a clean lint result."
