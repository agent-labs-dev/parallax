steps:
  turn-01:
    calls:
      - tool: wiki_create_page
        save: page
        args:
          title: "Q3 OKRs"
          space: Product
          body: |
            # Q3 OKRs
            Owner: Product team
            ## Objective 1: Make onboarding self-serve
            - KR: 70% of new workspaces finish setup without a support ticket
            ## Objective 2: Launch the mobile app beta
            - KR: 500 weekly active beta users by 30 September
            ## Objective 3: Cut report load times
            - KR: p95 dashboard load under 2 seconds
            ## Status
            Draft - pending review
    answer: "Created 'Q3 OKRs' in the Product space with Jordan's three objectives and their key results, laid out like Q2."
  turn-02:
    calls:
      - tool: wiki_comment
        args: {page: "{{saved.page.id}}", body: "@Lee Park could you review this before Friday?", mentions: [lee@northwind.test]}
    answer: "Tagged Lee on the Q3 OKRs page asking for a review before Friday."
