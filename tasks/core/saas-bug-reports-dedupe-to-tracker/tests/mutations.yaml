mutations:
  - {id: nothing-done, note: "claims the sweep is done", base: seed, must_fail: [comments-on-tracked-bugs, new-bugs-filed]}
  - id: regression-as-new-issue
    note: "files a fresh issue for the calendar duplicates instead of reopening closed LSP-109"
    patch:
      update: {tracker.issues: {LSP-109: {status: closed}}}
      delete: {tracker.comments: [cmt_6]}
      insert:
        tracker.issues:
          - {id: ISS-90, title: "Google Calendar sync duplicates recurring events again", body: "ZD-4025, ZD-4029, ZD-4050 (3 accounts).", status: open, assignee: null, labels: [bug, support, integrations], created: "2026-10-16T18:30:00-04:00", updated: "2026-10-16T18:30:00-04:00", url: "https://tracker.example/issues/ISS-90"}
    must_fail: [regression-reopened, only-bugs-tracked]
  - id: counts-people
    note: "follows the old wiki page and counts people, not accounts"
    patch:
      update:
        tracker.comments:
          cmt_1: {body: "Support triage w/c 12 Oct: ZD-4023, ZD-4035, ZD-4039, ZD-4067 (3 customers)."}
        tracker.issues:
          ISS-9: {body: "Tapping a comment/mention push notification lands in a different project. Zendesk: ZD-4021, ZD-4040 (2 customers)."}
    must_fail: [account-counts]
  - id: gmail-as-one-account
