    patch:
      update:
        tracker.comments:
          cmt_1: {body: "This week's Zendesk reports (2 distinct companies): ZD-4023, ZD-4035, ZD-4039, ZD-4067"}
        tracker.issues:
          ISS-9: {title: "Push notification tap opens a different project (Android)", labels: [bug, support, mobile, android]}
    answers:
      1: "Done. Commented on LSP-112 (2 accounts; ZD-4055 dropped, it was their proxy), LSP-118 (4, incl. Friday-night ZD-4068), LSP-131 (1: ZD-4036 was opened Tuesday night, before 4.14; the first try didn't stick so I re-posted it), LSP-140 (2) and LSP-166 (2, the late Slack reports: LSP-147 is closed as its duplicate). LSP-109's calendar duplicates came back after 4.13, so I reopened it and added ZD-4025/4029/4050 (3 accounts). Filed four new bugs with area labels: accented names dropped on CSV import (import), Android notification opens the wrong project (mobile), password reset link expired immediately (auth), VAT number still wrong after 4.14, ZD-4058, per Chen's email (billing). How-tos and feature requests stay in Zendesk; no customer replies sent."
