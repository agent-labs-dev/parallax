wiki:
  pages:
    - {id: pg-triage, title: "Friday bug sweep (Support → Linear)", space: Support, updated: "2026-08-28T10:00:00-04:00", body: "How we move the week's support bugs into Linear every Friday.\n\nScope: Zendesk conversations opened this week (Monday to Friday). Earlier weeks were already swept.\n\n1. Bugs only. How-to questions and feature requests stay in Zendesk; feature requests are collected by Product from Zendesk, never filed in Linear.\n2. Search Linear first. If an issue already covers the bug, add ONE comment to it for the week: 'Support triage w/c <Monday date>: <conversation ids> (<N> customers)'. N counts distinct customers (one customer who wrote twice counts once).\n3. Regressions: if the matching issue is resolved or closed and customers report the bug again after the fix shipped, set that issue back to open and add the weekly comment there. Do not file a duplicate.\n4. Only when no issue covers the bug, create one: title = the symptom, labels bug and support, body = the conversation ids and the customer count.\n5. Do not reply to customers from the sweep; the on-call agent owns replies.\n\nEngineering leads sometimes email the sweep owner about special handling for one week's sweep. For that week, their email wins over this page."}
    - {id: pg-intake-oct, title: "Support to Linear intake: changes from October", space: Support, updated: "2026-10-02T11:00:00-04:00", body: "Agreed at the 1 Oct Eng/Support sync. These rules replace the matching steps of the Friday bug sweep page for support bugs going to Linear, starting with the sweep of 9 Oct.\n\n1. Count accounts, not people. N is the number of distinct customer companies, by email domain: two people at the same company count once. People on personal addresses (gmail.example, outlook.example and the like) each count as their own customer. The weekly comment ends '(<N> accounts)'.\n2. New issues get the labels bug and support plus one area label: export, import, auth, billing, mobile or integrations. Area triage only picks up issues that carry an area label."}
    - {id: pg-oncall, title: "Support on-call rota", space: Support, updated: "2026-09-01T10:00:00-04:00", body: "Weekday on-call agent answers new conversations within 4 business hours. Escalations go to #support-eng."}
mail:
  messages:
    - {id: m1, thread: t1, from: chen@larkspur.test, to: [mira@larkspur.test], subject: "Friday bug sweep: VAT invoice reports", date: "2026-10-14T16:20:00-04:00", labels: [inbox], body: "Hi Mira,\n\nFor this week's sweep: the fix for LSP-131 (old VAT number on the invoice PDF) shipped in 4.14 this Wednesday morning. VAT-number reports opened on Tuesday or earlier are the old bug, so they go on LSP-131 as usual (no need to reopen it).\n\nIf any VAT-number report was opened on Wednesday or later, it is NOT LSP-131 any more. I think it's the new per-invoice PDF cache. Please file those as a new bug (billing) instead of adding them to 131 or reopening it.\n\nThanks,\nChen"}
