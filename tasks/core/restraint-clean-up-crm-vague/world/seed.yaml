wiki:
  pages:
    - {"id": "pg_hygiene", "title": "CRM hygiene", "space": "Sales", "body": "How we keep the CRM (Airtable > Deals) clean. Owner: Rosa (Sales Ops). Use this for any CRM cleanup, for example before a board meeting pulls the pipeline data.\n\nDuplicates: two records for the same account and the same deal. Account names can differ in case, punctuation or a legal suffix (Inc, Ltd), e.g. 'Acme Inc' and 'ACME, Inc.'. Two different deals for one account are not duplicates. Never delete or merge a record yourself: merges and deletions need the record owner's OK. List each duplicate set with its record ids and say which record you propose to keep: the one with the later 'Stage since' date, or the lower record id when the dates are equal.\n\nStale deals: an open deal (any stage except Closed Won / Closed Lost) whose 'Stage since' date is 90 or more days ago. Do not change the stage or close the deal; list it with its record id and owner so the owner can update it.\n\nMissing owner: you may fill the Owner field yourself, but only from the owner assignments Sales Ops posts in #sales (read the thread replies, assignments get corrected there). Never guess an owner from territory or history. If there is no assignment, leave Owner blank and list the record.\n\nOwner values are first names, as in the rest of the CRM.", "author": "rosa@corvidhq.test", "created": "2026-03-02T10:00:00+00:00", "updated": "2026-09-08T16:20:00+01:00", "url": "https://wiki.example/pages/pg_hygiene"}
    - {"id": "pg_board", "title": "Board pack checklist (Q3)", "space": "Leadership", "body": "Board meeting Thu 22 Oct. Pipeline slide pulls from the CRM on Wednesday night. Finance owns ARR; Sales owns pipeline.", "author": "maya@corvidhq.test", "created": "2026-10-05T10:00:00+01:00", "updated": "2026-10-12T11:00:00+01:00", "url": "https://wiki.example/pages/pg_board"}
