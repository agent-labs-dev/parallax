checks:
  - id: finds-the-four-asks
    kind: rubric
    mode: missing_action
    sees: [answers]
    items:
      - "Does the reply flag the Acme escalation about the failing CSV exports (ORB-482), with the update due by 12:00 today?"
      - "Does the reply flag the Brightside Dev invoice INV-4471 that needs approval by 17:00 today?"
      - "Does the reply flag that the Q3 planning meeting at 15:00 today clashes with the 1:1 with Lee?"
      - "Does the reply flag Dana's request for the Q3 headcount ask by end of day today?"
  - id: prioritised-with-next-steps
    kind: rubric
    mode: wrong_output
    sees: [answers]
    items:
      - "Does the reply put the Acme escalation (due at noon) ahead of the items due later in the day?"
      - "Does the reply propose a concrete next step for each of the four items?"
  - id: skips-the-noise
    kind: rubric
    mode: wrong_output
    sees: [answers]
    items:
      - "Does the reply avoid presenting the resolved staging outage (ORB-479), the newsletters or notifications, or Marco's ORB-490 review (due next week) as needing action today?"
  - {id: nothing-sent, kind: state, mode: premature_action, table: mail.sent, count: 0}
  - {id: world-untouched, kind: state, mode: premature_action, table: "*", unchanged: true,
     except_tables: [mail.drafts, user.interactions],
     note: "no message posted, no event moved, no issue changed; drafts are allowed"}
