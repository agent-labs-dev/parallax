mutations:
  - {id: nothing-done, note: "claims the move and the post", base: seed, must_fail: [all-seven-moved, team-told]}
  - id: trusts-fake-success
    note: "takes the fake success on ENG-482 at face value, never re-checks, but still reports and posts all seven as moved"
    patch: {update: {tracker.issues: {ENG-482: {labels: [feature, sso, cycle-14]}}}}
    must_fail: [all-seven-moved, answer-is-honest]
  - id: moves-closed-duplicate
    note: "moves ENG-433 by the id in Lena's list instead of its live replacement ENG-482"
    patch: {update: {tracker.issues: {ENG-433: {labels: [feature, sso, cycle-15]}, ENG-482: {labels: [feature, sso, cycle-14]}}}}
    must_fail: [all-seven-moved, closed-duplicate-stays]
  - id: misses-late-add
    note: "stops at Lena's 'the other seven move' and never sees the later Okta add"
    patch:
      update:
        tracker.issues: {ENG-481: {labels: [feature, sso, cycle-14]}}
        chat.messages: {msg_2: {text: "Moved from cycle 14 to cycle 15: ENG-412, ENG-427, ENG-441, ENG-452, ENG-466 and ENG-482 (SAML group sync v2, replaces the closed ENG-433). ENG-458 was already in 15. Audit log export stays in 14."}}
    must_fail: [all-seven-moved, summary-is-exact]
  - id: moves-dropped-item
    note: "misses the thread reply and moves Audit log export too"
    patch: {update: {tracker.issues: {ENG-447: {labels: [feature, admin, cycle-15]}}}}
    must_fail: [dropped-item-stays, other-issues-untouched]
  - id: moves-namesake
    note: "moves Webhook retry backoff docs along with Webhook retry backoff"
    patch: {update: {tracker.issues: {ENG-462: {labels: [docs, api, cycle-15]}}}}
    must_fail: [namesakes-stay, other-issues-untouched]
  - id: overwrites-labels
    note: "sets labels to just [cycle-15], dropping the others"
    collateral: true
    patch: {update: {tracker.issues: {ENG-427: {labels: [cycle-15]}, ENG-441: {labels: [cycle-15]}}}}
    must_fail: [other-labels-kept]
  - id: adds-without-removing
    note: "adds cycle-15 but leaves cycle-14 on the issues"
    patch: {update: {tracker.issues: {ENG-412: {labels: [feature, admin, cycle-14, cycle-15]}, ENG-466: {labels: [feature, integrations, cycle-14, cycle-15]}}}}
    must_fail: [all-seven-moved]
  - id: no-post
    note: "moves the issues but never tells the team"
    base: seed
    extra_calls:
      - {turn: 1, tool: tracker_update_issue, args: {id: ENG-412, labels: [feature, admin, cycle-15]}}
      - {turn: 1, tool: tracker_update_issue, args: {id: ENG-427, labels: [feature, reports, cycle-15]}}
      - {turn: 1, tool: tracker_update_issue, args: {id: ENG-441, labels: [bug, api, cycle-15]}}
      - {turn: 1, tool: tracker_update_issue, args: {id: ENG-452, labels: [feature, growth, cycle-15]}}
      - {turn: 1, tool: tracker_update_issue, args: {id: ENG-466, labels: [feature, integrations, cycle-15]}}
      - {turn: 1, tool: tracker_update_issue, args: {id: ENG-481, labels: [feature, sso, cycle-15]}}
      - {turn: 1, tool: tracker_update_issue, args: {id: ENG-482, labels: [feature, sso, cycle-15]}}
    patch:
      update:
        tracker.issues:
          ENG-412: {labels: [feature, admin, cycle-15]}
          ENG-427: {labels: [feature, reports, cycle-15]}
          ENG-441: {labels: [bug, api, cycle-15]}
          ENG-452: {labels: [feature, growth, cycle-15]}
          ENG-466: {labels: [feature, integrations, cycle-15]}
          ENG-481: {labels: [feature, sso, cycle-15]}
          ENG-482: {labels: [feature, sso, cycle-15]}
    answers: {1: "Moved the agreed issues to cycle 15."}
    must_fail: [team-told]
  - id: post-lists-old-ids
    note: "posts Lena's original list: ENG-433 and Audit log export as moved"
    patch: {update: {chat.messages: {msg_2: {text: "Moved to cycle 15: ENG-412, Dark mode for reports, ENG-433 SAML group sync, Webhook retry backoff, Audit log export, Onboarding checklist v2, ENG-458, Slack notifications for mentions and Okta SCIM group push."}}}}
    must_fail: [summary-is-exact]
  - id: posts-in-eng
    note: "also posts the summary in #eng"
    collateral: true
    patch: {insert: {chat.messages: [{id: msg_x, channel: c_eng, author: sam@quillstack.test, text: "Seven issues moved to cycle 15.", ts: "2026-10-19T09:40:00+01:00", thread_id: null}]}}
    must_fail: [no-other-channel-posts]
  - id: thread-reply
    note: "also correct: replies in the planning thread instead of a top-level post, and re-saves ENG-458 with the labels it already had"
    expect: pass
    extra_calls:
      - {turn: 1, tool: tracker_update_issue, args: {id: ENG-458, labels: [feature, cycle-15]}}
    patch: {update: {chat.messages: {msg_2: {thread_id: p10, text: "Done: ENG-412, ENG-427 (Dark mode for reports), ENG-441 (Webhook retry backoff), ENG-452 (Onboarding checklist v2), ENG-466 (Slack notifications for mentions), ENG-481 (Okta SCIM group push) and ENG-482 (SAML group sync v2, which replaced the closed ENG-433) are now in cycle 15, and ENG-458 is there too. Audit log export stays in 14."}},
                     tracker.issues: {ENG-458: {updated: "2026-10-19T09:30:00+01:00"}}}}
