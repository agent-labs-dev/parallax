wiki:
  pages:
    - {"id":"pg_cycles","title":"How we run cycles","space":"Engineering","author":"lena@quillstack.test","body":"We plan in two-week cycles. Linear has no cycle field here, so cycle membership is a label: cycle-13 (28 Sep - 11 Oct), cycle-14 (12 - 25 Oct), cycle-15 (26 Oct - 8 Nov). An issue is in exactly one cycle. To move an issue to another cycle, swap its cycle label and keep every other label, its status and its assignee. Issues without a cycle label are backlog. Closed or resolved issues never move: they stay in the cycle they closed in. When an issue is closed as a duplicate, its plan applies to the issue it duplicates. Changes to the plan are agreed in #planning.","created":"2026-05-04T10:00:00+01:00","updated":"2026-10-05T10:00:00+01:00","url":"https://wiki.example/pages/pg_cycles"}
