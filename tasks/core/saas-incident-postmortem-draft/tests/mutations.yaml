mutations:
  - {id: nothing-done, note: "claims the write-up is done", base: seed, must_fail: [page-from-template, agreed-action-items-only]}
  - id: stripe-root-cause
    note: "reads only the first messages and keeps the retracted Stripe theory"
    patch:
      update:
        wiki.pages:
          page_5: {body: "## Summary\nCheckout failed for 1 h 35 min because Stripe's API was degraded.\n\n## Impact\n13:12-14:47 UTC (1 h 35 min). 9 distinct customers contacted support. 1,284 failed checkouts.\n\n## Timeline (UTC)\n13:05 pricing-service v2.31 deployed\n13:12 alert\n13:19 Stripe degradation identified\n14:17 rollback decision\n14:40 rollback complete\n14:47 recovered\n\n## Root cause\nStripe API degradation, made worse by a pool size change in pricing-service v2.31.\n\n## Action items\n- ISS-1 (Lena)\n- ISS-4 (Ana)\n- ISS-3 (Omar)\n\n## Lessons learned\nAdd a payment provider fallback."}
    must_fail: [agreed-root-cause]
  - id: local-times
    note: "copies the times as posted, so the deploy is 14:05 and the rollback 15:40"
    patch:
      update:
        wiki.pages:
          page_5: {body: "## Summary\npricing-service v2.31 set the shared checkout-db maxPoolSize to 5 instead of 50; checkout-api ran out of DB connections.\n\n## Impact\n13:12-14:47 UTC (1 h 35 min). 9 distinct customers contacted support (12 tickets). 1,284 failed checkouts.\n\n## Timeline (UTC)\n13:12 alert, impact starts\n13:44 Stripe ruled out\n14:05 pricing-service v2.31 deployed\n14:17 rollback decision\n15:40 rollback complete\n10:47 5xx back to baseline\n\n## Root cause\nv2.31 changed maxPoolSize from 50 to 5 in the shared Helm values; pool exhaustion. Stripe ruled out.\n\n## Action items\n- ISS-1 CI guard (Lena)\n- ISS-4 pool alert (Ana)\n- ISS-3 canary (Omar)\n\n## Lessons learned\nGuard shared config."}
    must_fail: [timeline-in-utc]
  - id: tickets-as-customers
    note: "counts tickets instead of customers and uses the partial failed-checkout count"
    patch:
      update:
        wiki.pages:
          page_5: {body: "## Summary\npricing-service v2.31 set the shared checkout-db maxPoolSize to 5 instead of 50; checkout-api ran out of DB connections. Stripe was ruled out.\n\n## Impact\n13:12-14:47 UTC (1 h 35 min). 14 customers contacted support. About 800 failed checkouts.\n\n## Timeline (UTC)\n13:05 v2.31 deployed\n13:12 alert\n13:44 Stripe ruled out\n13:53 cause found\n14:17 rollback decision\n14:40 rollback complete\n14:47 recovered\n\n## Root cause\nmaxPoolSize 50 -> 5 in v2.31 shared values; pool exhaustion.\n\n## Action items\n- ISS-1 (Lena)\n- ISS-4 (Ana)\n- ISS-3 (Omar)\n\n## Lessons learned\nGuard shared config."}
    must_fail: [impact-figures]
