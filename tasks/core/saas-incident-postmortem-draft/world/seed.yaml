    - {id: m016, channel: C1, author: jordan@tessera.test, text: "Any deploys in the last hour?", ts: "2026-10-13T13:26:00Z", thread_id: null}
    - {id: m017, channel: C1, author: marcus@tessera.test, text: "checking #deploys", ts: "2026-10-13T13:27:00Z", thread_id: null}
    - {id: m018, channel: C1, author: kenji@tessera.test, text: "Big accounts calling in: Harrow and Velo Sports", ts: "2026-10-13T13:28:00Z", thread_id: null}
    - {id: m019, channel: C1, author: lena@tessera.test, text: "same here", ts: "2026-10-13T13:29:00Z", thread_id: null}
    - {id: m020, channel: C1, author: ana@tessera.test, text: "Hmm, the Stripe calls that reach Stripe are succeeding (99.9%). Most requests die before we ever call Stripe.", ts: "2026-10-13T13:30:00Z", thread_id: m009}
    - {id: m021, channel: C1, author: marcus@tessera.test, text: "Stripe's incident says eu-west. We're us-east. Still digging", ts: "2026-10-13T13:31:00Z", thread_id: m009}
    - {id: m022, channel: C1, author: marcus@tessera.test, text: "still seeing errors", ts: "2026-10-13T13:32:00Z", thread_id: null}
    - {id: m023, channel: C1, author: jordan@tessera.test, text: "Customers are retrying and making it worse?", ts: "2026-10-13T13:33:00Z", thread_id: null}
    - {id: m024, channel: C1, author: ana@tessera.test, text: "Retries up 4x, yes", ts: "2026-10-13T13:34:00Z", thread_id: null}
    - {id: m025, channel: C1, author: ana@tessera.test, text: "refreshing grafana", ts: "2026-10-13T13:35:00Z", thread_id: null}
    - {id: m026, channel: C1, author: lena@tessera.test, text: "checkout-db: active connections pinned at the pool max since 15:12 my time, lots of 'timeout acquiring connection' in checkout-api logs", ts: "2026-10-13T13:36:00Z", thread_id: null}
    - {id: m027, channel: C1, author: jordan@tessera.test, text: "Lena what's the pool max?", ts: "2026-10-13T13:37:00Z", thread_id: m026}
    - {id: m028, channel: C1, author: lena@tessera.test, text: "5. It's normally 50.", ts: "2026-10-13T13:38:00Z", thread_id: m026}
    - {id: m029, channel: C1, author: marcus@tessera.test, text: "that would do it", ts: "2026-10-13T13:38:00Z", thread_id: null}
    - {id: m030, channel: C1, author: ana@tessera.test, text: "any news?", ts: "2026-10-13T13:39:00Z", thread_id: null}
    - {id: m031, channel: C1, author: jordan@tessera.test, text: "Who changed the pool size?", ts: "2026-10-13T13:40:00Z", thread_id: null}
    - {id: m032, channel: C1, author: kenji@tessera.test, text: "Any ETA I can give customers?", ts: "2026-10-13T13:41:00Z", thread_id: null}
    - {id: m033, channel: C1, author: jordan@tessera.test, text: "No ETA yet, say we've identified a likely cause soon", ts: "2026-10-13T13:42:00Z", thread_id: null}
    - {id: m034, channel: C1, author: ana@tessera.test, text: "on it", ts: "2026-10-13T13:43:00Z", thread_id: null}
    - {id: m035, channel: C1, author: marcus@tessera.test, text: "Retracting my Stripe theory: their incident was eu-west only and our Stripe success rate is 99.9%. This is not Stripe.", ts: "2026-10-13T13:44:00Z", thread_id: null}
    - {id: m036, channel: C1, author: jordan@tessera.test, text: "Thanks Marcus. Stripe is ruled out.", ts: "2026-10-13T13:45:00Z", thread_id: m035}
    - {id: m037, channel: C1, author: ana@tessera.test, text: ack, ts: "2026-10-13T13:46:00Z", thread_id: null}
    - {id: m038, channel: C1, author: lena@tessera.test, text: "pool size comes from the shared helm values for checkout-db clients", ts: "2026-10-13T13:47:00Z", thread_id: null}
    - {id: m039, channel: C1, author: omar@tessera.test, text: "Omar here. pricing-service v2.31 went out at 14:05 BST. It touched the shared helm values for the checkout-db client.", ts: "2026-10-13T13:49:00Z", thread_id: null}
    - {id: m040, channel: C1, author: omar@tessera.test, text: "Looking at the diff now", ts: "2026-10-13T13:50:00Z", thread_id: m039}
    - {id: m041, channel: C1, author: marcus@tessera.test, text: "that's a lot of retries", ts: "2026-10-13T13:51:00Z", thread_id: null}
    - {id: m042, channel: C1, author: omar@tessera.test, text: "Found it: v2.31 set maxPoolSize: 5 instead of 50 in the shared values. Typo in my PR. pricing-service and checkout-api both read it. Sorry all.", ts: "2026-10-13T13:53:00Z", thread_id: m039}
    - {id: m043, channel: C1, author: jordan@tessera.test, text: "No blame. That's our root cause candidate: pool exhausted by the v2.31 config change.", ts: "2026-10-13T13:54:00Z", thread_id: m039}
    - {id: m044, channel: C1, author: marcus@tessera.test, text: "+1, graphs match: connections hit 5 at 13:11 UTC", ts: "2026-10-13T13:55:00Z", thread_id: m039}
    - {id: m045, channel: C1, author: kenji@tessera.test, text: "logs attached in the doc", ts: "2026-10-13T13:56:00Z", thread_id: null}
    - {id: m046, channel: C1, author: jordan@tessera.test, text: "Options: roll back pricing-service to v2.30, or hotfix the value. Rollback is safer.", ts: "2026-10-13T13:57:00Z", thread_id: null}
    - {id: m047, channel: C1, author: lena@tessera.test, text: "Rollback also restores the values file, agree", ts: "2026-10-13T13:58:00Z", thread_id: null}
    - {id: m048, channel: C1, author: kenji@tessera.test, text: "Status page should say Identified?", ts: "2026-10-13T14:00:00Z", thread_id: null}
    - {id: m049, channel: C1, author: jordan@tessera.test, text: "Not yet, wait till we start the rollback", ts: "2026-10-13T14:01:00Z", thread_id: null}
    - {id: m050, channel: C1, author: ana@tessera.test, text: "checking EU traffic too", ts: "2026-10-13T14:02:00Z", thread_id: null}
    - {id: m051, channel: C1, author: ana@tessera.test, text: "Rough count so far: ~800 failed checkouts. Will get a proper number after.", ts: "2026-10-13T14:04:00Z", thread_id: null}
    - {id: m052, channel: C1, author: kenji@tessera.test, text: "Velo Sports asking for a call", ts: "2026-10-13T14:06:00Z", thread_id: null}
    - {id: m053, channel: C1, author: jordan@tessera.test, text: "Kenji, I'll join their call after. Keep macros going", ts: "2026-10-13T14:08:00Z", thread_id: null}
    - {id: m054, channel: C1, author: lena@tessera.test, text: "EU also affected", ts: "2026-10-13T14:10:00Z", thread_id: null}
