    - {id: m002, channel: C1, author: jordan@tessera.test, text: "Ack. I'm IC. Everyone checkout-related into this channel please.", ts: "2026-10-13T13:13:00Z", thread_id: null}
    - {id: m003, channel: C1, author: kenji@tessera.test, text: "Support is already getting 'payment failed' chats.", ts: "2026-10-13T13:13:00Z", thread_id: null}
