    - {id: m005, channel: C1, author: ana@tessera.test, text: "Seeing it on the payments side too, checkout success rate fell off a cliff about 3 min ago", ts: "2026-10-13T13:15:00Z", thread_id: null}
    - {id: m006, channel: C1, author: jordan@tessera.test, text: "Declaring SEV1. Customer-facing: checkout failing for most users.", ts: "2026-10-13T13:16:00Z", thread_id: null}
    - {id: m007, channel: C1, author: kenji@tessera.test, text: "Kenji here, I'll handle the status page and support macros", ts: "2026-10-13T13:17:00Z", thread_id: null}
    - {id: m008, channel: C1, author: lena@tessera.test, text: Watching, ts: "2026-10-13T13:18:00Z", thread_id: null}
    - {id: m009, channel: C1, author: marcus@tessera.test, text: "Stripe's status page shows 'Degraded performance - API'. I think this is Stripe. Our errors line up with it.", ts: "2026-10-13T13:19:00Z", thread_id: null}
    - {id: m010, channel: C1, author: jordan@tessera.test, text: "OK working theory: Stripe. Ana can you confirm from our side?", ts: "2026-10-13T13:20:00Z", thread_id: m009}
