    - {id: m074, channel: C1, author: jordan@tessera.test, text: "Closing SEV1. Thanks all. Postmortem to follow; Priya will write it up.", ts: "2026-10-13T15:31:00Z", thread_id: null}
    - {id: m075, channel: C1, author: ana@tessera.test, text: "Final number from the payments dashboard: 1,284 failed checkouts between 13:12 and 14:47 UTC. Ignore my ~800 from earlier, that was partial.", ts: "2026-10-13T16:20:00Z", thread_id: null}
    - {id: m076, channel: C1, author: kenji@tessera.test, text: "Thanks Ana. Support saw a wave of tickets, I'll leave the exact count to Zendesk.", ts: "2026-10-13T16:22:00Z", thread_id: null}
    - {id: m077, channel: C1, author: jordan@tessera.test, text: "Postmortem review notes. Root cause (agreed): pricing-service v2.31 changed the shared checkout-db client values, maxPoolSize 50 -> 5 (typo). checkout-api ran out of DB connections and returned 5xx. Stripe was not involved. Impact window 9:12-10:47 ET. Action items in this thread, please.", ts: "2026-10-14T15:00:00Z", thread_id: null}
    - {id: m078, channel: C1, author: lena@tessera.test, text: "Proposal: a CI check that rejects any change to maxPoolSize below 20 without DBA approval.", ts: "2026-10-14T15:03:00Z", thread_id: m077}
    - {id: m079, channel: C1, author: jordan@tessera.test, text: "Agreed. Lena owns it.", ts: "2026-10-14T15:05:00Z", thread_id: m077}
    - {id: m080, channel: C1, author: marcus@tessera.test, text: "Proposal: page on-call when checkout-db connection use is above 80% for 2 minutes. We had no alert on the pool itself.", ts: "2026-10-14T15:06:00Z", thread_id: m077}
    - {id: m081, channel: C1, author: jordan@tessera.test, text: "Agreed, Marcus owns it.", ts: "2026-10-14T15:08:00Z", thread_id: m077}
    - {id: m082, channel: C1, author: kenji@tessera.test, text: "Could we auto-post a status page banner whenever checkout 5xx goes over 10%?", ts: "2026-10-14T15:09:00Z", thread_id: m077}
    - {id: m083, channel: C1, author: jordan@tessera.test, text: "Nice idea but parking it, not an action item for this one.", ts: "2026-10-14T15:11:00Z", thread_id: m077}
    - {id: m084, channel: C1, author: ana@tessera.test, text: "Should we add a second payment provider as a fallback?", ts: "2026-10-14T15:12:00Z", thread_id: m077}
    - {id: m085, channel: C1, author: jordan@tessera.test, text: "No, Stripe wasn't involved. Not doing that.", ts: "2026-10-14T15:13:00Z", thread_id: m077}
    - {id: m086, channel: C1, author: omar@tessera.test, text: "Proposal: put pricing-service behind the canary deploy stage like checkout-api, so a bad config hits 5% of traffic first.", ts: "2026-10-14T15:15:00Z", thread_id: m077}
    - {id: m087, channel: C1, author: jordan@tessera.test, text: "Agreed, Omar owns it.", ts: "2026-10-14T15:16:00Z", thread_id: m077}
    - {id: m088, channel: C1, author: marcus@tessera.test, text: "Also maybe rewrite pricing-service in Go lol", ts: "2026-10-14T15:18:00Z", thread_id: m077}
    - {id: m089, channel: C1, author: jordan@tessera.test, text: "lol no", ts: "2026-10-14T15:18:00Z", thread_id: m077}
    - {id: m090, channel: C1, author: lena@tessera.test, text: "Should we split the helm values so services don't share the DB client block?", ts: "2026-10-14T15:20:00Z", thread_id: m077}
    - {id: m091, channel: C1, author: jordan@tessera.test, text: "Worth discussing at the platform sync, not an action item yet.", ts: "2026-10-14T15:22:00Z", thread_id: m077}
    - {id: m092, channel: C1, author: jordan@tessera.test, text: "That's the list: three agreed items. @priya over to you for the write-up and the Linear tickets.", ts: "2026-10-14T15:24:00Z", thread_id: m077}
