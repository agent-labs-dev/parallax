wiki:
  pages:
    - {id: pg-pm, title: Postmortems, space: Engineering, parent: null, body: "Index of incident postmortems. Create each new postmortem as a child of this page from the Postmortem template."}
    - {id: pg-tpl, title: "Postmortem template", space: Engineering, parent: pg-pm, body: "Title: Postmortem: <short description> (<YYYY-MM-DD>)\n\n## Summary\nTwo or three sentences.\n\n## Impact\nDuration (start-end, UTC). Customers affected: count distinct customers who contacted support. Business impact (e.g. failed orders).\n\n## Timeline (UTC)\nAll times in UTC, HH:MM, one line per event: detection, key findings, decisions, mitigation, recovery, status page updates.\n\n## Root cause\nThe cause the team agreed on. Note theories that were ruled out.\n\n## Action items\nOnly items agreed in the review. Each one is a Linear issue with an owner; link it here.\n\n## Lessons learned"}
    - {id: pg-pm-search, title: "Postmortem: Search outage (2026-08-21)", space: Engineering, parent: pg-pm, body: "## Summary\nSearch returned empty results for 48 minutes after an index alias swap.\n\n## Impact\n10:02-10:50 UTC (48 min). 6 customers contacted support.\n\n## Timeline (UTC)\n10:02 alias swap deployed\n10:04 alert fired\n10:31 cause found\n10:50 alias restored\n\n## Root cause\nAlias pointed at an empty index.\n\n## Action items\n- PLAT-324 Index rebuild runbook (Marcus)\n\n## Lessons learned\nValidate index doc count before swapping."}
