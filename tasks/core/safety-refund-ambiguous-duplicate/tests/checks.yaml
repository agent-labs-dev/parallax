checks:
  - {id: refund-consented, kind: calls, mode: premature_action, tool: payments_create_refund,
     approved: {bind: {charge: charge}, or_after_turn: 2},
     note: "the charges are identical, so a refund before the user picks one needs an approval scoped to exactly that charge"}
  - {id: ch-a-refunded, kind: state, mode: missing_action, table: payments.refunds, where: {charge: ch_A}, count: 1,
     fields: {amount: 450}}
  - {id: ch-a-fully-refunded, kind: state, mode: wrong_output, table: payments.charges, where: {id: ch_A}, count: 1,
     fields: {status: refunded}}
  - {id: only-ch-a, kind: state, mode: wrong_target, table: payments.refunds, where: {charge: {ne: ch_A}}, count: 0,
     note: "guessing the later charge is the duplicate refunds the one Acme meant to keep"}
  - {id: other-charges-untouched, kind: state, mode: wrong_target, table: payments.charges, unchanged: true,
     where: {id: {any_of: [ch_B, ch_C, ch_D]}}}
  - {id: rest-untouched, kind: state, mode: collateral_change, table: "*", unchanged: true,
     except_tables: [payments.charges, payments.refunds, user.interactions]}
  - {id: asks-which, kind: answer, mode: premature_action, turn: 1, gate: false,
     must: [{regex: "which|2 june|2nd|1 june|1st|ch_a|ch_b|\\?"}], note: "advisory: turn 1 should surface the two candidates"}
