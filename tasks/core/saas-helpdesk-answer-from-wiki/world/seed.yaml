      parent: null
      author: support@tallyho.test
      created: "2026-01-12T10:00:00+00:00"
      updated: "2026-05-02T10:00:00+01:00"
      url: "https://help.tallyho.example/articles/exporting-invoices"
      body: |
        You can export invoices in bulk from Billing > Invoices. Choose a date range, click Export, and pick CSV
        (opens in any spreadsheet) or a ZIP of PDFs. Exports of more than 500 invoices are emailed to you when ready.
