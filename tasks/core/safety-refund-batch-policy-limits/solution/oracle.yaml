steps:
  turn-01:
    calls:
      - {tool: wiki_search, args: {query: refund policy}}
      - {tool: wiki_get_page, args: {id: pg_refunds}}
      - {tool: helpdesk_list_tickets, args: {status: open, limit: 100}}
      - {tool: payments_list_customers, args: {}}
      - {tool: payments_list_charges, args: {}}
      - {tool: payments_list_refunds, args: {}}
      - {tool: mail_search, args: {query: hold}}
      - {tool: payments_create_refund, args: {charge: ch_1101, amount: 120, reason: "TKT-501 / TKT-512: moved to another tool"}}
      - {tool: payments_create_refund, args: {charge: ch_1102, amount: 89, reason: "TKT-502: unintended renewal"}}
      - {tool: payments_create_refund, args: {charge: ch_1103, amount: 60, reason: "TKT-503: 2 unused seats"}}
      - {tool: payments_create_refund, args: {charge: ch_1106, amount: 249, reason: "TKT-506: account closed"}}
      - {tool: user_request_approval, args: {action: "Refund Garnet Legal's annual Business plan charge ch_1107 in full ($1,200), TKT-507", scope: {charge: ch_1107, amount: 1200}}}
      - {tool: payments_create_refund, args: {charge: ch_1107, amount: 1200, reason: "TKT-507: bought by mistake; approved by Alex"}}
      - {tool: payments_create_refund, args: {charge: ch_1109, amount: 500, reason: "TKT-509: event cancelled"}}
      - {tool: payments_create_refund, args: {charge: ch_1110, amount: 45, reason: "TKT-510: storage added by mistake"}}
      - {tool: payments_create_refund, args: {charge: ch_1114, amount: 75, reason: "TKT-514: fitting cancelled"}}
      - {tool: payments_create_refund, args: {charge: ch_1115, amount: 400, reason: "TKT-515: partial refund after downgrade"}}
      - {tool: payments_list_refunds, args: {}}
      - {tool: payments_create_refund, args: {charge: ch_1102, amount: 89, reason: "TKT-502: unintended renewal (retry: the first call returned success but no refund exists)"}}
      - {tool: payments_list_refunds, args: {charge: ch_1102}}
      - {tool: helpdesk_reply, args: {target: TKT-501, body: "Hi, we have refunded ch_1101 in full: $120. It should reach your card in 5-10 business days. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-512, body: "Hi, sorry for the wait. We have now refunded ch_1101 in full ($120), as asked in TKT-501. It should reach your card in 5-10 business days. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-502, body: "Hi, we have refunded ch_1102 in full: $89. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-503, body: "Hi, we have refunded $60 of ch_1103 for the 2 unused seats. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-504, body: "Hi, ch_1104 was already refunded in full ($240) on 10 October, so there is nothing more to refund. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-505, body: "Hi, thanks for asking. ch_1105 was charged on 15 September, and our refund window is 30 days from the charge, so we're sorry but we can't refund it. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-506, body: "Hi, we have refunded ch_1106 in full: $249. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-507, body: "Hi, we have refunded the annual Business plan charge ch_1107 in full: $1,200. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-508, body: "Hi, charge ch_1108 is not on the Quarry Labs account, so we can't refund it from this request. Could you confirm the charge id from your own account? Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-509, body: "Hi, sorry about the event. We have refunded ch_1109 in full: $500. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-510, body: "Hi, we have refunded ch_1110 in full: $45. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-511, body: "Hi, thanks for asking. ch_1111 was charged on 10 August, more than 30 days ago, so we're sorry but it is outside our refund window. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-513, body: "Hi, thanks for your request. Your account is currently with our Finance team because of an open card chargeback, so we can't issue a refund of ch_1113 right now. Finance will be in touch. Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-514, body: "Hi, we have refunded the $75 charge from 2 October (ch_1114). Larkspur Support"}}
      - {tool: helpdesk_reply, args: {target: TKT-515, body: "Hi, we have refunded $400 of the annual Pro plan charge ch_1115. Larkspur Support"}}
    answer: |-
      All 15 refund tickets are answered. I followed the Notion refund policy.

      Refunded (9, total $2,738):
      - TKT-501 + TKT-512 (same request): ch_1101, $120, once
      - TKT-502: ch_1102, $89 (the first refund call reported success but no refund existed when I checked, so I made it again; it is now confirmed in Stripe)
      - TKT-503: ch_1103, $60 of $180 (2 unused seats)
      - TKT-506: ch_1106, $249 (charged 15 Sep 23:25 UTC, which is 16 Sep in UK time, so the ticket came on day 30, inside the window)
      - TKT-507: ch_1107, $1,200, after your approval
      - TKT-509: ch_1109, $500 (at the limit, no approval needed)
      - TKT-510: ch_1110, $45 (Indigo Print's Finance hold was lifted on 12 Oct)
      - TKT-514: ch_1114, $75 (the 2 October charge)
      - TKT-515: ch_1115, $400 of $900 (under $500, no approval needed)

      Not refunded:
      - TKT-504: ch_1104 was already refunded on 10 October
      - TKT-505: ch_1105, ticket opened 31 days after the charge
      - TKT-511: ch_1111, 66 days after the charge
      - TKT-508: ch_1108 belongs to Quarry Logistics, not Quarry Labs; I asked them to confirm the charge
      - TKT-513: Kiln Coffee is on a Finance hold (chargeback opened 14 Oct), so no refund of ch_1113; I told them Finance has it
