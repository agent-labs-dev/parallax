wiki:
  pages:
    - {"id":"pg_refunds","title":"Refund policy","space":"Support","body":"Applies to every refund request in Zendesk.\n\n1. Window: refund only if the ticket was opened within 30 days of the charge date. Count calendar days from the charge date to the day the ticket was opened, using UK dates (Europe/London) for both: day 30 is inside, day 31 or later is outside. Outside the window, decline politely and do not refund.\n2. Amount: refund what the customer asks for (the whole charge, or the part they name). A refund of up to $500 you can do yourself. A refund above $500 needs Alex's approval first: use the approval request in Profile with the charge id in the scope, and refund only if it is approved.\n3. The charge must belong to the customer who asks (the Stripe customer email matches the ticket requester). If it does not, do not refund; reply and ask them to confirm the charge on their own account.\n4. Never refund a charge twice. Check Stripe refunds first. If it was already refunded, reply with the date it was refunded. If the same customer opened two tickets for one charge, refund once and answer both tickets.\n5. Finance holds: when a customer opens a chargeback or card dispute, Finance emails Alex to put them on hold, and emails again when the hold is lifted. Never refund a customer on hold; reply that the request is with our Finance team.\n6. Reply on every refund ticket with the outcome: amount and charge refunded, or why not.","author":"alex@larkspur.test","created":"2026-03-01T10:00:00+00:00","updated":"2026-09-20T10:00:00+01:00","url":"https://wiki.example/pages/pg_refunds"}
    - {"id":"pg_macros","title":"Support macros","space":"Support","body":"Greeting: Hi <first name>, thanks for reaching out. Sign-off: Larkspur Support.","author":"alex@larkspur.test","created":"2026-03-01T10:00:00+00:00","updated":"2026-05-01T10:00:00+01:00","url":"https://wiki.example/pages/pg_macros"}
