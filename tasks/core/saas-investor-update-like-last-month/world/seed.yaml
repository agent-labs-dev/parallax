mail:
  sent:
    - {id: s_aug, thread: s_aug, from: nadia@fernly.test, to: [nadia@fernly.test], cc: [], bcc: [priya@northbeam.example, tom@larchcapital.example, alex.kim@halcyonvc.example, mira@angelcircle.example, dev.patel@foundry12.example, lucia@olivegrove.example, ola@formerfund.example], subject: "Fernly - August update", body: "Hi all,\n\nHere's Fernly's August update.\n\nHighlights\n- Shipped the Shopify integration; 14 stores live by month end.\n- Hired our second support engineer, Kemi.\n\nMetrics (August)\n- MRR: £38,965 (+4.9% MoM)\n- Weekly active accounts (last full week, 24-30 Aug): 53\n- Cash in bank (30 Aug): £2,044,400\n- Net burn: £121,700\n- Runway: 16 months\n\nLowlights\n- Two Pro customers paused over budget freezes.\n\nAsks\n- Intros to heads of ops at mid-size Shopify brands.\n\nThanks,\nNadia\n\nMRR = recurring subscription charges billed in the month, net of refunds; one-off services are excluded. Runway = cash / net burn.", in_reply_to: null, date: "2026-09-04T08:30:00+01:00", draft: null}
    - {id: s_sep, thread: s_sep, from: nadia@fernly.test, to: [nadia@fernly.test], cc: [], bcc: [priya@northbeam.example, tom@larchcapital.example, alex.kim@halcyonvc.example, mira@angelcircle.example, dev.patel@foundry12.example, lucia@olivegrove.example, sam.osei@redbrickvc.example], subject: "Fernly - September update", body: "Hi all,\n\nHere's Fernly's September update.\n\nHighlights\n- Shipped the Shopify integration; 14 stores live by month end.\n- Hired our second support engineer, Kemi.\n\nMetrics (September)\n- MRR: £41,380 (+6.2% MoM)\n- Weekly active accounts (last full week, 21-27 Sep): 57\n- Cash in bank (30 Sep): £1,926,000\n- Net burn: £118,400\n- Runway: 16 months\n\nLowlights\n- Two Pro customers paused over budget freezes.\n\nAsks\n- Intros to heads of ops at mid-size Shopify brands.\n\nThanks,\nNadia\n\nMRR = recurring subscription charges billed in the month, net of refunds; one-off services are excluded. Runway = cash / net burn.", in_reply_to: null, date: "2026-10-05T08:40:00+01:00", draft: null}
    - {id: s_x1, thread: t_x1, from: nadia@fernly.test, to: [kemi@fernly.test], cc: [], bcc: [], subject: "Welcome aboard", body: "Kemi - great to have you. Laptop arrives Monday.", in_reply_to: null, date: "2026-10-01T09:00:00+01:00", draft: null}
