    - {id: m_priya, thread: t_priya, from: priya@northbeam.example, to: [nadia@fernly.test], subject: "Adding Jo to your updates", body: "Hi Nadia, I'm going on leave in November. Could you add my partner Jo Feld (jo@northbeam.example) to your monthly updates from now on? Keep me on too. Thanks, Priya", date: "2026-10-14T09:31:00+01:00", labels: [inbox]}
