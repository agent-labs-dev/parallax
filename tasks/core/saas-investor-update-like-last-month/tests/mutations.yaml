    expect: pass
    patch: {update: {mail.drafts: {draft_1: {to: [priya@northbeam.example, jo@northbeam.example, alex.kim@halcyonvc.example, mira@angelcircle.example, dev.patel@foundry12.example, lucia@olivegrove.example, sam.osei@redbrickvc.example], bcc: []}}}}
    answers:
      1: "Draft saved (not sent): 'Fernly - October update'. MRR £44,275 (+7.0%), 56 weekly active accounts (19-25 Oct), cash £1,801,100, burn £124,900, runway ~14 months. I took Tom off the list and added Jo Feld at jo@northbeam.example. Highlights, lowlights and asks need your words."
