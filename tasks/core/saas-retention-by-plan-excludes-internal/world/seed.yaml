user: {name: Lea Hoffmann, email: lea@kitebase.test, timezone: Europe/Berlin}
wiki:
  pages:
    - {id: pg_defs, title: "Metric definitions", space: Data, author: lea@kitebase.test, created: "2026-02-02T10:00:00+01:00", updated: "2026-08-12T15:40:00+02:00", url: "https://wiki.example/pages/pg_defs", body: "Definitions we report against. If a dashboard disagrees with this page, this page wins.\n\n## Retention (day 28)\nThe share of a month's signups who are still using Kitebase after their trial: they start a session after their 14-day trial ends and within 28 days of signing up. A signup belongs to the calendar month (Berlin time) of its signed_up event and to the plan it signed up on (the plan property of signed_up); later upgrades or downgrades do not move it.\nPostHog: funnel signed_up -> trial_ended -> session_started, 28-day window.\nThe saved insight \"Retention (30-day)\" is the old definition (any session within 30 days). Do not use it.\n\n## Who counts\nExclude internal accounts and test accounts from every customer metric.\n- Internal: anyone signing up with our own domain, kitebase.test. Staff get comped Team workspaces.\n- Test: QA throwaway signups on kitebase-qa.test. QA always creates them on Starter.\n- One-off exclusions (pilots, migrations) are agreed with Lea by email; check for them before reporting a month.\n\n## Activation\nA signup who invites a teammate within 7 days."}
    - {id: pg_onb, title: "September hiring and onboarding", space: People, author: lea@kitebase.test, created: "2026-09-01T09:00:00+02:00", updated: "2026-09-20T09:00:00+02:00", url: "https://wiki.example/pages/pg_onb", body: "Ten new starters in September. Each sets up their own Kitebase workspace in week one to learn the product."}
  comments:
    - {id: wc1, page: pg_defs, author: tomas@kitebase.test, mentions: [lea@kitebase.test], created: "2026-09-03T11:05:00+02:00", body: "Heads-up for Who counts: since 1 September QA's new automated harness signs up on qa-auto.example (always Starter), not kitebase-qa.test. Please treat qa-auto.example as a test domain too."}
mail:
  messages:
    - {id: m1, thread: t1, from: jonas@kitebase.test, to: [lea@kitebase.test], cc: [], labels: [inbox], date: "2026-10-05T16:12:00+02:00", subject: "Brightline pilot accounts", body: "Hi Lea, for your September numbers: the four Brightline workspaces (brightline.example, Business plan) were set up by my team for their paid pilot, and the pilot contract makes their admins log in every week. Please keep them out of the retention numbers, they are not self-serve customers. Thanks, Jonas"}
    - {id: m2, thread: t2, from: noreply@posthog.example, to: [lea@kitebase.test], cc: [], labels: [inbox], date: "2026-10-01T08:00:00+02:00", subject: "Your weekly PostHog digest", body: "Signups last week: 14. Top event: session_started."}
