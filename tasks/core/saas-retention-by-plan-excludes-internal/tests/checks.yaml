  - id: names-team-and-business
    kind: rubric
    mode: wrong_output
    sees: [answers]
    items:
      - "Does the reply say that retention dropped for the Team plan, from about 62.5% (10 of 16) for August signups to about 33.3% (5 of 15) for September signups?"
      - "Does the reply say that retention also dropped for the Business plan, from about 62.5% (5 of 8) to about 42.9% (3 of 7)?"
