wiki:
  pages:
    - {id: pg_metrics, title: Metrics, space: Metrics, parent: null, author: sam@tallyhq.test, created: "2026-01-05T09:00:00-08:00", updated: "2026-09-21T09:00:00-07:00", url: "https://wiki.example/pages/pg_metrics", body: "Home for the weekly metrics reports. One page per week, titled \"Weekly metrics - w/c <Monday>\", under this page."}
    - {id: pg_w38, title: "Weekly metrics - w/c 21 Sep 2026", space: Metrics, parent: pg_metrics, author: sam@tallyhq.test, created: "2026-09-28T10:02:00-07:00", updated: "2026-09-28T10:02:00-07:00", url: "https://wiki.example/pages/pg_w38", body: "## Headline\nSteady week; the Xero sync launch drove a bump in signups midweek.\n\n## Growth\n- Signups: 41\n- Activation (7-day): 41.5% (17/41)\n- Weekly active users: 198\n\n## Revenue\n- Net new revenue: $7,655.00 (gross $7,954.00, refunds $299.00)\n\n## Support\n- Tickets opened: 24\n\n## Notes\n- Xero sync shipped Wednesday.\n\n---\nHow we compute: the week runs Monday to Sunday, Pacific time. Signups = PostHog signed_up events. Activation = PostHog insight \"Activation (7-day)\" over the week's signups. WAU = PostHog insight \"Weekly active users\" for the week. Net new revenue = Stripe charges created in the week minus refunds issued in the week. Tickets = Zendesk tickets created in the week, any status."}
    - {id: pg_w39, title: "Weekly metrics - w/c 28 Sep 2026", space: Metrics, parent: pg_metrics, author: sam@tallyhq.test, created: "2026-10-05T09:48:00-07:00", updated: "2026-10-05T09:48:00-07:00", url: "https://wiki.example/pages/pg_w39", body: "## Headline\nRevenue up on two annual upgrades; support volume normal.\n\n## Growth\n- Signups: 38\n- Activation (7-day): 44.7% (17/38)\n- Weekly active users: 211\n\n## Revenue\n- Net new revenue: $8,940.00 (gross $9,310.00, refunds $370.00)\n\n## Support\n- Tickets opened: 27\n\n## Notes\n- Two annual Business upgrades (Fjord Media, Orchid Foods).\n- Refunded a duplicate charge for Lumen Retail.\n\n---\nHow we compute: the week runs Monday to Sunday, Pacific time. Signups = PostHog signed_up events. Activation = PostHog insight \"Activation (7-day)\" over the week's signups. WAU = PostHog insight \"Weekly active users\" for the week. Net new revenue = Stripe charges created in the week minus refunds issued in the week. Tickets = Zendesk tickets created in the week, any status."}
    - {id: pg_okr, title: "Q4 OKRs", space: Company, parent: null, author: sam@tallyhq.test, created: "2026-10-01T09:00:00-07:00", updated: "2026-10-01T09:00:00-07:00", url: "https://wiki.example/pages/pg_okr", body: "1. Reach 260 weekly active users.\n2. Activation (7-day) above 50%.\n3. Net new revenue of $40k a month."}
  comments:
    - {id: wc_01, page: pg_w39, author: dana@tallyhq.test, mentions: [sam@tallyhq.test], created: "2026-10-05T15:30:00-07:00", body: "@Sam from the w/c 5 Oct report on, leave our internal sandbox out of revenue: anything billed to a tallyhq.test address is card testing, not revenue. The footer is out of date on this."}
