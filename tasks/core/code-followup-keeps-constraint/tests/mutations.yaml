      feedsync/dates.py: |
        import re
        from datetime import date


        class DateError(ValueError):
            pass


        _MONTH_NAMES = [
            ("jan", "january"), ("feb", "february"), ("mar", "march"),
            ("apr", "april"), ("may", "may"), ("jun", "june"),
            ("jul", "july"), ("aug", "august"), ("sep", "september"),
            ("oct", "october"), ("nov", "november"), ("dec", "december"),
        ]
        _MONTHS = {
            name: index
            for index, (abbr, full) in enumerate(_MONTH_NAMES, start=1)
            for name in (abbr, full)
        }

        _DMY_SLASH = re.compile(r"^(\d{1,2})/(\d{1,2})/(\d{4})$")
        _D_MON_Y = re.compile(r"^(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})$")


        def parse_feed_date(text: str) -> date:
            """Parse a date from a partner feed row.

            Accepts ISO dates (2026-06-03), UK-style day-first slash dates
            (12/06/2026), and 'D Mon YYYY' style dates (3 Jun 2026 / 3 June 2026).
            """
            cleaned = text.strip()

            try:
                return date.fromisoformat(cleaned)
            except ValueError:
                pass

            try:
                match = _DMY_SLASH.match(cleaned)
                if match:
                    day, month, year = (int(part) for part in match.groups())
                    return date(year, month, day)

                match = _D_MON_Y.match(cleaned)
                if match:
                    day_text, month_text, year_text = match.groups()
                    month = _MONTHS.get(month_text.lower())
                    if month is None:
                        raise ValueError(f"unknown month name: {month_text!r}")
                    return date(int(year_text), month, int(day_text))
            except ValueError as exc:
                raise DateError(f"unrecognised date: {text!r}") from exc

            raise DateError(f"unrecognised date: {text!r}")
      tests/test_dates.py: |
        from datetime import date

        import pytest
        from feedsync.dates import DateError, parse_feed_date
        from feedsync.rows import accept


        def test_iso():
            assert parse_feed_date("2026-06-03") == date(2026, 6, 3)


        def test_garbage_is_rejected():
            with pytest.raises(DateError):
                parse_feed_date("next tuesday")


        def test_uk_slash_date():
            assert parse_feed_date("12/06/2026") == date(2026, 6, 12)
            assert parse_feed_date("3/6/2026") == date(2026, 6, 3)


        def test_day_month_name_year():
            assert parse_feed_date("3 Jun 2026") == date(2026, 6, 3)
            assert parse_feed_date("3 June 2026") == date(2026, 6, 3)
            assert parse_feed_date("03 JUN 2026") == date(2026, 6, 3)


        def test_invalid_slash_date_is_rejected():
            with pytest.raises(DateError):
                parse_feed_date("13/13/2026")


        def test_invalid_month_name_is_rejected():
            with pytest.raises(DateError):
                parse_feed_date("3 Junuary 2026")


        def test_accept_splits_rows():
            good, rejected = accept(
                [
                    {"date": "2026-06-03"},
                    {"date": "12/06/2026"},
                    {"date": "3 Jun 2026"},
                    {"date": "soon"},
                ]
            )
            assert [r["date"] for r in good] == [
                date(2026, 6, 3),
                date(2026, 6, 12),
                date(2026, 6, 3),
            ]
            assert rejected == ["soon"]
