    note: "breaks what accept() returns for rejected rows, then loosens test_accept_splits_rows until it passes again"
    files:
      feedsync/rows.py: |
        from feedsync.dates import DateError, parse_feed_date


        def accept(rows: list[dict[str, str]]) -> tuple[list[dict[str, object]], list[object]]:
            """Split rows into parsed ones and the raw dates that were rejected."""
            good: list[dict[str, object]] = []
            rejected: list[object] = []
            for row in rows:
                try:
                    good.append({**row, "date": parse_feed_date(row["date"])})
                except DateError:
                    rejected.append(row)
            return good, rejected
