mutations:
  - id: title-only
    note: "retitles the slide but leaves the figure"
    files: {deck.html: "<section data-slide=\"2\"><h2>Q2 results</h2><strong>42%</strong>activation rate</section>"}
    must_fail: [activation-fixed]
  - id: figure-only
    note: "fixes the figure but keeps the old heading"
    files: {deck.html: "<section data-slide=\"2\"><h2>Momentum is real</h2><strong>44%</strong>activation rate</section>"}
    must_fail: [slide2-retitled]
  - id: never-edited
    note: "claims both fixes, edits nothing"
    base: seed
    must_fail: [slide2-retitled, activation-fixed]
  - id: rewrites-deck
    note: "regenerates the deck and drops the other slides"
    collateral: true
    files: {deck.html: "<html><body><section data-slide=\"2\"><h2>Q2 results</h2><div class=\"metric\"><strong>44%</strong>activation rate</div></section></body></html>"}
    must_fail: [other-slides-and-styles-kept, rest-of-slide-2-kept]
  - id: also-moves-deadline
    note: "makes both fixes but also changes the slide 4 approval date"
    collateral: true
    files:
      deck.html: "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <title>Northstar activation review</title>\n  <style>\n    :root { --ink:#10233f; --blue:#276ef1; --mint:#53d8b1; --paper:#f6f8fc; --muted:#637089; }\n    * { box-sizing:border-box; }\n    body { margin:0; background:#dde3ee; color:var(--ink); font:18px/1.35 Arial,sans-serif; }\n    section[data-slide] { width:1280px; height:720px; margin:24px auto; padding:72px 84px; background:var(--paper); position:relative; overflow:hidden; }\n    h1 { font-size:64px; max-width:900px; margin:0 0 30px; }\n    h2 { font-size:42px; margin:0 0 28px; }\n    .eyebrow { color:var(--blue); font-weight:700; letter-spacing:.12em; text-transform:uppercase; }\n    .metric { display:inline-block; width:30%; margin-right:2%; padding:28px; background:white; border-top:8px solid var(--mint); }\n    .metric strong { display:block; font-size:48px; }\n    .note { color:var(--muted); }\n    .recommendation { margin-top:40px; padding:30px; color:white; background:var(--ink); border-left:12px solid var(--mint); }\n    footer { position:absolute; bottom:34px; left:84px; color:var(--muted); font-size:14px; }\n  </style>\n</head>\n<body>\n  <section data-slide=\"1\">\n    <p class=\"eyebrow\">Northstar · Q2 product review</p>\n    <h1>Activation improved, but the setup gap still compounds</h1>\n    <p class=\"note\">Decision review · 14 July 2026</p>\n    <footer>Internal planning fixture</footer>\n  </section>\n  <section data-slide=\"2\">\n    <p class=\"eyebrow\">The quarter</p><h2>Q2 results</h2>\n    <div class=\"metric\"><strong>44%</strong>activation rate<br><span class=\"note\">from 35% in Q1</span></div>\n    <div class=\"metric\"><strong>18 min</strong>median setup<br><span class=\"note\">from 27 minutes</span></div>\n    <div class=\"metric\"><strong>61%</strong>week-4 retention<br><span class=\"note\">activated teams</span></div>\n    <footer>Source: Northstar Q2 product dataset</footer>\n  </section>\n  <section data-slide=\"3\">\n    <p class=\"eyebrow\">Where users stall</p><h2>Three setup barriers explain most failed activations</h2>\n    <p><strong>31%</strong> cannot map their first data source without help. <strong>24%</strong> stop at permissions.\n      <strong>19%</strong> never invite a teammate. Interview evidence suggests terminology, unclear ownership,\n      delayed data availability, security review, missing examples, and uncertainty about the first useful workflow\n      all contribute. Enterprise administrators experience the longest delays, while small teams progress faster.</p>\n    <div class=\"recommendation\"><strong>Recommendation:</strong> create a guided setup path focused on data mapping,\n      permission readiness, and the first shared workflow.</div>\n    <footer>Source: funnel events and 18 onboarding interviews</footer>\n  </section>\n  <section data-slide=\"4\">\n    <p class=\"eyebrow\">Decision</p><h2>Fund a six-week guided-setup pilot</h2>\n    <p>Assign one product designer and two engineers. Measure successful data mapping, time to first shared workflow,\n      and week-4 retention. Keep the existing self-serve path as the control.</p>\n    <div class=\"recommendation\">Approve the pilot by <strong>7 August 2026</strong>; review evidence on 18 September.</div>\n    <footer>Owner: Growth product team</footer>\n  </section>\n  <section data-slide=\"5\">\n    <p class=\"eyebrow\">Guardrails</p><h2>What would change our mind?</h2>\n    <p>Stop if setup time does not improve by at least 20%, support contacts rise by more than 10%, or the pilot causes\n      a measurable permissions-error increase. Do not declare a retention win without the full week-4 window.</p>\n    <footer>Northstar activation review</footer>\n  </section>\n</body>\n</html>\n"
    must_fail: [other-slides-and-styles-kept]
