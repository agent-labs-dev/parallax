  messages:
    - {id: m1, channel: ch_comp, author: "priya@brightloop.test", text: "Reminder: Q3 commissions get run off the Commission plan sheet as usual. Post exceptions here.", ts: "2026-07-03T09:12:00+01:00", thread_id: null}
    - {id: m2, channel: ch_comp, author: "priya@brightloop.test", text: "Quota relief for Mei: she lost the Nordics accounts when we closed that region in July. I'd like her Q3 quota cut to 440k for commission. @omar can finance sign off?", ts: "2026-07-28T16:40:00+01:00", thread_id: null}
    - {id: m3, channel: ch_comp, author: "omar@brightloop.test", text: "Signed off at 400k, not 440k - the Nordics book was bigger than we thought. Lena, use 400k for Mei in the Q3 run; the Quotas sheet only gets fixed at planning.", ts: "2026-08-04T11:05:00+01:00", thread_id: m2}
    - {id: m4, channel: ch_comp, author: "omar@brightloop.test", text: "Plan change from Q3 on, agreed with Priya: a deal only counts in the quarter it closed if its first invoice is paid by the end of that quarter (midnight, London time). If the cash lands later, the deal rolls into the next quarter's run, so list those deals with each run for the reps. Rest of the plan unchanged.", ts: "2026-08-12T10:20:00+01:00", thread_id: null}
    - {id: m5, channel: ch_comp, author: "jonah@brightloop.test", text: "Does Onyx Analytics count for me? It closed 11 Sep.", ts: "2026-09-14T08:55:00+01:00", thread_id: null}
    - {id: m6, channel: ch_comp, author: "priya@brightloop.test", text: "Yes if it's paid in time, same as everything else.", ts: "2026-09-14T09:30:00+01:00", thread_id: m5}
