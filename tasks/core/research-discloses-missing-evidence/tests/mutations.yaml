    answers: {1: "| Tool | Price | SSO |\n|---|---|---|\n| Canvasly | $180 | SAML SSO included on Team and on Scale |\n| Fernpoll | $235 | Yes |\n| Pellucid | quote from sales only | Yes |\n| Surveyra | $310 | Add-on |"}
