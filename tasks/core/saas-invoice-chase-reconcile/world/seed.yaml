wiki:
  pages:
    - id: pg1
      title: Collections process
      space: Finance
      author: priya@fernhill.test
      created: "2026-02-03T10:00:00+00:00"
      updated: "2026-07-21T15:00:00+01:00"
      url: https://wiki.example/pages/pg1
      body: |-
        How we sort out overdue invoices. The AR ledger sheet is the source of truth; keep it in step with Stripe.

        1. Reconcile first. Stripe charge descriptions carry the invoice number. If a charge for the full amount succeeded, set the ledger row's Status to Paid. A part payment does not settle an invoice: leave it Unpaid and chase only the balance. A failed charge is not a payment.
        2. Credit notes (CN- rows) cancel the invoice named in their Note. Set that invoice's Status to Credited; nothing is owed on it.
        3. Chase invoices that are more than 30 days past their due date. Don't chase a customer who has promised in writing to pay by a date that hasn't come yet. If a promised date has passed and the money hasn't arrived, chase and mention the missed promise.
        4. One chaser per customer, listing each overdue invoice and the amount still owed, to the AP address on their Stripe customer record. Use last month's chasers as the template. Leave chasers as drafts: Priya reviews and sends every one herself.
        5. Invoices 30 days overdue or less get no chaser yet; list them in the summary with anything else that needs a decision.
