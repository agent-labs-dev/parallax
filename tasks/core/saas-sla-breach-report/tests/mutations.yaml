    patch:
      update:
        chat.messages:
          msg_2: {text: "SLA breaches, week of 12 Oct (first reply, business hours CT): 14 total. Enterprise 9: TKT-5153 (Zephyr Media), TKT-5176 (Lattice Studio), TKT-5182 (Ironwood Energy), TKT-5188 (Marlow Labs), TKT-5197 (Orchid Health), TKT-5200 (Ironwood Labs), TKT-5210 (Rook Foods), TKT-5220 (Saltmarsh Energy), TKT-5224 (Fjord Freight). Pro 3: TKT-5167 (Heron Foods), TKT-5181 (Tamber Media), TKT-5198 (Northwind Labs). Starter 2: TKT-5170 (Vantage Dental), TKT-5205 (Acme Dental)."}
    answers:
