        chat.messages:
          msg_2: {text: "SLA breaches, week of 12 Oct (first reply, business hours CT): 10 total. Enterprise 6: TKT-5153 (Zephyr Media), TKT-5176 (Lattice Studio), TKT-5182 (Ironwood Energy), TKT-5188 (Marlow Labs), TKT-5200 (Ironwood Labs), TKT-5210 (Rook Foods). Pro 2: TKT-5167 (Heron Foods), TKT-5181 (Tamber Media). Starter 2: TKT-5170 (Vantage Dental), TKT-5205 (Acme Dental). P1 window excluded."}
