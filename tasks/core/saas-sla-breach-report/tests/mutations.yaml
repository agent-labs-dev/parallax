        chat.messages:
          msg_2: {text: "SLA breaches, week of 12 Oct (first reply, business hours CT): 14 total. Enterprise 9: TKT-5153, TKT-5176, TKT-5182, TKT-5188, TKT-5197, TKT-5200, TKT-5210, TKT-5220, TKT-5224. Pro 3: TKT-5167, TKT-5181, TKT-5198. Starter 2: TKT-5170, TKT-5205. Excluded for Thursday's P1 (16:30-18:00): TKT-5209."}
