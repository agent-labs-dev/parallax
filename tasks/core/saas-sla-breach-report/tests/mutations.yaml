      insert:
        chat.messages:
          - {id: msg_90, channel: C01, author: sam@brightloop.test, text: "Reposting: 12 SLA breaches last week (Enterprise 8, Pro 2, Starter 2).", ts: "2026-10-19T17:30:00+01:00", thread_id: null}
