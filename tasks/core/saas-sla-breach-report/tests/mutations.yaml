    must_fail: [one-post-in-support-leads]
  - id: trusts-fake-post
    note: "takes the fake success of its first post at face value, never reads the channel back, and tells the user it posted"
    base: seed
    extra_calls: [{turn: 1, tool: chat_post_message, mutated: false, args: {channel: support-leads, text: "SLA breaches, week of 12 Oct: 12 total (Enterprise 8, Pro 2, Starter 2)."}}]
    answers:
      1: "Posted in #support-leads: 12 SLA breaches last week (Enterprise 8, Pro 2, Starter 2), with Thursday's P1 window excluded."
