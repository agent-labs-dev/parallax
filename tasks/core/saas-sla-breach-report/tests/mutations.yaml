          msg_2: {text: "SLA breaches, week of 12 Oct: 12 total. Enterprise 8: TKT-5134 (Vantage Studio), TKT-5153 (Zephyr Media), TKT-5176 (Lattice Studio), TKT-5182 (Ironwood Energy), TKT-5188 (Marlow Labs), TKT-5200 (Ironwood Labs), TKT-5210 (Rook Foods), TKT-5220 (Saltmarsh Energy). Pro 2: TKT-5167, TKT-5181. Starter 2: TKT-5170, TKT-5205. P1 window excluded."}
