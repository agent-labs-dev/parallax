      update:
        chat.messages:
          msg_2: {text: "SLA breaches, week of 12 Oct (first reply, business hours CT): 20 total. Enterprise 12: TKT-5139, TKT-5148, TKT-5150, TKT-5151, TKT-5153, TKT-5176, TKT-5182, TKT-5188, TKT-5200, TKT-5210, TKT-5220, TKT-5224. Pro 5: TKT-5137, TKT-5140, TKT-5152, TKT-5167, TKT-5181. Starter 3: TKT-5142, TKT-5170, TKT-5205. P1 window (TKT-5197, TKT-5198) excluded."}
    must_fail: [breach-list-exact, tier-counts]
  - id: first-100-only
    note: "reads only the first 100 tickets, so it never sees the weekend breaches TKT-5220 and TKT-5224"
