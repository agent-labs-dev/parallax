wiki:
  pages:
    - {id: pg-sla, title: "Support SLA policy", space: Support, updated: "2026-09-01T10:00:00+01:00", body: "First-reply SLA for customer tickets.\n\nTargets by plan tier: Enterprise 2 business hours, Pro 8 business hours, Starter 24 business hours. Free accounts have no first-reply SLA.\n\nBusiness hours are the support team's: Monday to Friday, 09:00-17:00 US Central time (America/Chicago), except the support holidays posted in #support. Nights, weekends and holidays do not count. The clock starts when the ticket is created, or at the next business-hours opening if it is created outside business hours, and it stops at the first reply (first_reply_at in Zendesk). Zendesk timestamps are UTC.\n\nThe tier that applies is the account's tier when the ticket was created, not its tier today. Account tiers live in the Airtable Accounts base; match the requester's email domain to the account's Domain or one of its Other domains.\n\nA breach is a first reply later than the target. The weekly breach report covers tickets created Monday 00:00 to Sunday 23:59 Central time and goes to #support-leads every Monday.\n\nThe Head of Support can exclude tickets from a week's report, for example those created during a declared P1 incident. Exclusions are sent by email to the support leads."}
    - {id: pg-esc, title: "Escalation paths", space: Support, updated: "2026-07-01T10:00:00+01:00", body: "P1 incidents go to #inc. Billing disputes go to finance@brightloop.test."}
chat:
  channels:
    - {id: C01, name: support-leads, members: [sam@brightloop.test, dana@brightloop.test, luis@brightloop.test], topic: "Support leadership"}
    - {id: C02, name: support, members: [sam@brightloop.test, dana@brightloop.test], topic: "Team chat"}
  messages:
    - {id: M1, channel: C01, author: dana@brightloop.test, ts: "2026-10-05T16:02:00+01:00", thread_id: null, text: "SLA breaches, week of 28 Sep (first reply, business hours CT): 3 total. Enterprise 1: TKT-4890 (Kepler Media). Pro 2: TKT-4871 (Rook Labs), TKT-4902 (Wren Foods). Starter 0."}
    - {id: M2, channel: C01, author: dana@brightloop.test, ts: "2026-10-12T15:48:00+01:00", thread_id: null, text: "SLA breaches, week of 5 Oct (first reply, business hours CT): 4 total. Enterprise 2: TKT-4987 (Halden Health), TKT-5002 (Juno Labs). Pro 1: TKT-4990 (Corvid Media). Starter 1: TKT-5011 (Ember Foods)."}
    - {id: M3, channel: C01, author: luis@brightloop.test, ts: "2026-10-12T16:10:00+01:00", thread_id: M2, text: "Thanks. Reminder that Free tickets never count, and use the tier at ticket creation."}
    - {id: M4, channel: C01, author: dana@brightloop.test, ts: "2026-10-16T18:30:00+01:00", thread_id: null, text: "I'm out Monday. @sam can you do the SLA rundown this week?"}
    - {id: M0, channel: C02, author: luis@brightloop.test, ts: "2026-10-08T15:20:00+01:00", thread_id: null, text: "Holiday reminder: Monday 12 Oct (Indigenous Peoples' Day) is a support holiday for the US team, skeleton crew only. It is not a business day for SLA; tickets that come in on Monday start the clock Tuesday 09:00 CT."}
    - {id: M5, channel: C02, author: luis@brightloop.test, ts: "2026-10-19T14:05:00+01:00", thread_id: null, text: "Morning all, queue is calm."}
mail:
  messages:
    - {id: e1, thread: te1, from: luis@brightloop.test, to: [support-leads@brightloop.test], subject: "Last week's SLA report: P1 exclusion", date: "2026-10-16T09:10:00+01:00", labels: [inbox], body: "Hi leads,\n\nFor last week's SLA rundown: tickets created during Thursday's P1 (the login outage), from 16:30 to 18:00 UK time on Thursday 15 Oct, are excluded from the breach list and the counts. Our replies were blocked by the outage, not by the team. Please mention the exclusion in the post.\n\nLuis"}
    - {id: e2, thread: te2, from: luis@brightloop.test, to: [support@brightloop.test], subject: "P1 resolved: login outage", date: "2026-10-15T18:20:00+01:00", labels: [inbox], body: "The login outage is resolved. Status page updated. Thanks all for the patience today."}
    - {id: e3, thread: te3, from: billing@tablesapp.example, to: [sam@brightloop.test], subject: "Your invoice for October", date: "2026-10-14T07:00:00+01:00", labels: [inbox], body: "Your Team plan invoice for October is ready."}
    - {id: e4, thread: te4, from: dana@brightloop.test, to: [sam@brightloop.test], subject: "Monday cover", date: "2026-10-16T18:40:00+01:00", labels: [inbox], body: "Thanks for covering Monday. The queue should be quiet; ping Luis if anything escalates."}
