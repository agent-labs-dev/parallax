  turn-01:
    calls:
      - {tool: user_clock_now, args: {}}
      - {tool: chat_read_channel, args: {channel: support-leads}}
      - {tool: wiki_search, args: {query: SLA}}
      - {tool: wiki_get_page, args: {id: pg-sla}}
      - {tool: chat_read_channel, args: {channel: support}}
      - {tool: mail_search, args: {query: SLA}}
      - {tool: mail_get, args: {id: e1}}
      - {tool: helpdesk_list_tickets, args: {limit: 100}}
      - {tool: helpdesk_list_tickets, args: {limit: 100, offset: 100}}
