steps:
  turn-01:
    calls:
      - {tool: sheets_list_sheets, args: {}}
      - {tool: sheets_read, args: {sheet: KPIs}}
      - {tool: wiki_search, args: {query: KPI}}
      - {tool: wiki_get_page, args: {id: pg_kpi}}
      - {tool: payments_list_charges, args: {}}
      - {tool: payments_list_refunds, args: {}}
      - {tool: analytics_trend, args: {event: signed_up, date_from: "2026-09-01", date_to: "2026-09-30", interval: week}}
      - {tool: analytics_list_insights, args: {}}
      - {tool: analytics_run_insight, args: {id: ins_act7, date_from: "2026-09-01", date_to: "2026-09-30"}}
