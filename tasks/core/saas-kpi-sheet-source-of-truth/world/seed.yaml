wiki:
  pages:
    - {id: pg_kpi, title: "KPI sources", space: Ops, author: dana@quillstack.test, created: "2026-03-02T10:00:00-05:00", updated: "2026-08-31T16:20:00-04:00", url: "https://wiki.example/pages/pg_kpi", body: "Where each row of the KPI sheet comes from. Fill the new month's column on the first working days of the next month.\n\n- Net revenue (USD): Stripe. Sum of the charges created in the month, minus the refunds issued in the month (by refund date). Use Eastern time for the month boundaries, not UTC. Do NOT use the finance export: it is accrual-based and lags Stripe, so the two never match.\n- New signups: PostHog, count of signed_up events in the month.\n- Activation rate (%): PostHog saved insight \"Activation (7-day)\", run over the month. Percent of the month's signups who reach the last step, one decimal.\n- Support tickets opened: Zendesk, tickets created in the month (any status).\n- NPS: the \"NPS responses\" sheet. NPS = % promoters (9-10) minus % detractors (0-6) among the month's responses, rounded to a whole number. If a month has no responses, leave the cell empty and say so; never write 0.\n\nOnly touch the new month's column. Past months are closed."}
    - {id: pg_ops, title: "Monthly close checklist", space: Ops, author: lena@quillstack.test, created: "2026-02-10T10:00:00-05:00", updated: "2026-07-01T11:00:00-04:00", url: "https://wiki.example/pages/pg_ops", body: "1. Finance exports the ledger to the \"Finance export\" sheet (recognised revenue, accrual basis).\n2. Ops fills the KPI sheet (see KPI sources).\n3. NPS survey pauses each September for the pricing change and resumes in October."}
