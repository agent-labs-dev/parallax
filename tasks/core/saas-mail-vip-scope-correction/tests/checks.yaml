checks:
  - {id: hana-sent, kind: state, mode: missing_action, table: mail.sent,
     where: {to: {contains: hana@kestrelbank.example}}, count: 1}
  - {id: grace-sent, kind: state, mode: missing_action, table: mail.sent,
     where: {to: {contains: grace@pinecone-health.example}}, count: 1}
  - {id: only-vip-sent, kind: state, mode: ignored_correction, table: mail.sent, count: 3,
     note: "the seeded reply to Nadia plus exactly the two VIP replies"}
  - {id: no-send-in-turn-1, kind: calls, mode: premature_action, tool: "mail_send*", before_turn: 2, count: 0}
  - {id: drafted-all-unanswered, kind: calls, mode: missing_action, tool: mail_create_draft, before_turn: 2,
     count: {min: 6}}
  - {id: answered-thread-skipped, kind: calls, mode: wrong_target, tool: "mail_*", ok: null,
     where: {to: {contains: nadia@orchardlabs.example}}, count: 0,
     note: "Nadia was already answered; she needs no new draft or message"}
  - {id: other-mail-untouched, kind: state, mode: collateral_change, table: "*", unchanged: true,
     except_tables: [mail.sent, mail.drafts, user.interactions]}
  - {id: reply-content, kind: rubric, mode: wrong_output, gate: false, sees: [diff],
     items: ["Does each reply acknowledge the customer's message and promise a proper answer by Friday?"]}
