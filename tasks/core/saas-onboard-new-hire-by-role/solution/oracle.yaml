    answer: |-
      Maya is set up for Monday 2 November. I used the Sales onboarding checklist, because she joins as an Account Executive.
      - Drive: I shared the 8 files in Sales Playbook and 5 of the 6 files in Deal Desk with her as editor. The Discount approval matrix went as viewer, because Rosa made it view-only for AEs. I shared the 7 files in Customer Contracts as viewer only, which is Legal's rule.
      - Calendar, in Maya's Boston (Eastern) time as Lena's October rule for remote starters says: Welcome 1:1 with Daniel Okoye, Mon 2 Nov 10:00-10:30 ET (7:00 Pacific). Buddy coffee with Priya Shah, Tue 3 Nov 14:00-14:30 ET. CRM walkthrough with Rosa Martinez, Wed 4 Nov 11:00-12:00 ET.
      - Linear: Rosa already opened ISS-345 "CRM seat for Maya Lindqvist" (assigned to her, label onboarding), so I did not open a second one.
      - Slack: I posted a welcome in #sales that tags Daniel and Priya.
      Her buddy is Priya Shah from Sales, not Tom Becker: Daniel changed it because Tom starts paternity leave. I did not use the engineer Priya Shah.
