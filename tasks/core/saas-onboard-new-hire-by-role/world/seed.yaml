wiki:
  pages:
    - {id: w1, title: 'New starter onboarding: how we run it', space: People, body: 'People Ops runs onboarding in the week before a new starter''s first day, from the checklist for their role. Checklists: ''Onboarding checklist: Sales'' and ''Onboarding checklist: Engineering''. Other teams: ask their manager. Week-1 meeting times are Pacific time. If HR names a buddy who can''t do it, the manager picks the replacement.', parent: null, author: lena.fischer@fernway.test, created: '2026-02-01T10:00:00-08:00', updated: '2026-09-15T10:00:00-07:00', url: 'https://wiki.example/pages/w1'}
    - {id: w2, title: 'Onboarding checklist: Sales', space: People, body: "For Account Executives, SDRs and other Sales hires.\n1. Drive: share every file in the 'Sales Playbook' and 'Deal Desk' folders with the new hire as editor. Share the files in 'Customer Contracts' view-only (viewer, never editor: Legal's rule). Do not share 'Sales Archive'.\n2. Calendar, week 1 (invite the new hire to each):\n   - Monday 10:00-10:30 'Welcome 1:1' with their manager.\n   - Tuesday 14:00-14:30 'Buddy coffee' with their buddy.\n   - Wednesday 11:00-12:00 'CRM walkthrough' with the Revenue Operations lead.\n3. Linear: open one issue 'CRM seat for <name>', assigned to the Revenue Operations lead, label onboarding.\n4. Slack: post a welcome in #sales that tags the manager and the buddy.", parent: null, author: lena.fischer@fernway.test, created: '2026-02-01T10:00:00-08:00', updated: '2026-09-15T10:00:00-07:00', url: 'https://wiki.example/pages/w2'}
    - {id: w3, title: 'Onboarding checklist: Engineering', space: People, body: "For engineers and engineering managers.\n1. Drive: share every file in 'Engineering Handbook' and 'Architecture' with the new hire as editor.\n2. Calendar, week 1 (invite the new hire to each):\n   - Monday 10:00-10:30 'Welcome 1:1' with their manager.\n   - Tuesday 13:00-14:00 'Dev environment setup' with the IT lead.\n   - Thursday 15:00-16:00 'Architecture overview' with their buddy.\n3. Linear: open one issue 'Laptop and GitHub access for <name>', assigned to the IT lead, label onboarding.\n4. Slack: post a welcome in #eng-team that tags the manager and the buddy.", parent: null, author: lena.fischer@fernway.test, created: '2026-02-01T10:00:00-08:00', updated: '2026-09-15T10:00:00-07:00', url: 'https://wiki.example/pages/w3'}
    - {id: w4, title: Expense policy summary, space: Finance, body: Submit receipts within 30 days. Meals up to $60 a day when travelling., parent: null, author: lena.fischer@fernway.test, created: '2026-02-01T10:00:00-08:00', updated: '2026-09-15T10:00:00-07:00', url: 'https://wiki.example/pages/w4'}
    - {id: w5, title: Holiday calendar 2026, space: People, body: 'Company holidays: 26-27 Nov (Thanksgiving), 24 Dec - 1 Jan.', parent: null, author: lena.fischer@fernway.test, created: '2026-02-01T10:00:00-08:00', updated: '2026-09-15T10:00:00-07:00', url: 'https://wiki.example/pages/w5'}
    - {id: w6, title: Sales team rituals, space: Sales, body: 'Pipeline review Mondays 09:00. Deal desk office hours Thursdays 13:00. Wins go in #sales-wins.', parent: null, author: lena.fischer@fernway.test, created: '2026-02-01T10:00:00-08:00', updated: '2026-09-15T10:00:00-07:00', url: 'https://wiki.example/pages/w6'}
