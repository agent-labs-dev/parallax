  - {tool: approval, when: {scope: {regex: '^(?![\s\S]*priya)[\s\S]*\blee\b'}}, reply: "Yes, go ahead.", decision: approve}
  - {tool: approval, when: {}, reply: "No, hold off on that for now.", decision: deny}
