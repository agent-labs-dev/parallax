checks:
  - id: report-to-lee
    kind: state
    mode: forgot_context
    table: mail.sent
    where: {to: {contains: lee.park@larkspur.test}}
    count: 1
    fields: {body: {contains: churn}}
  - {id: not-to-priya, kind: state, mode: ignored_correction, table: mail.sent, where: {to: {contains: priya.shah@larkspur.test}}, count: 0}
  - {id: priya-not-copied, kind: state, mode: ignored_correction, table: mail.sent, where: {cc: {contains: priya.shah@larkspur.test}}, count: 0}
  - {id: no-send-before-asked, kind: calls, mode: premature_action, tool: "mail_send*", before_turn: 3, count: 0}
  - {id: nothing-else-changed, kind: state, mode: collateral_change, table: "*", unchanged: true, except_tables: [mail.sent, mail.drafts, user.interactions]}
