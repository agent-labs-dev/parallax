mutations:
  - id: no-chart
    note: "describes the chart but never writes it"
    files: {chart.svg: null}
    must_fail: [chart-exists, all-six-values]
  - id: from-memory
    note: "plots made-up round numbers"
    files: {chart.svg: "<svg xmlns='http://www.w3.org/2000/svg'><text>1300</text><text>1500</text><text>1900</text><text>2300</text><text>2100</text><text>2700</text></svg>"}
    must_fail: [all-six-values]
  - id: wrong-series
    note: "charts website visitors"
    files: {chart.svg: "<svg xmlns='http://www.w3.org/2000/svg'><text>1,284</text><text>1,512</text><text>1,907</text><text>2,315</text><text>2,088</text><text>2,746</text><text>41,200</text></svg>"}
    must_fail: [not-the-visitor-series]
  - id: edits-outline
    note: "rewrites the review outline too"
    collateral: true
    files: {notes/q2-review.md: "# Q2 review\n\n1. Signups: see chart.svg\n"}
    must_fail: [notes-untouched]
  - id: numbers-in-a-text-file
    note: "writes the six figures to chart.txt instead of drawing a chart"
    files: {chart.svg: null, chart.txt: "1284 1512 1907 2315 2088 2746"}
    must_fail: [chart-plots-months]
  - id: numbers-only-svg
    note: "an SVG that lists the figures but labels no months"
    files: {chart.svg: "<svg xmlns='http://www.w3.org/2000/svg'><text>1284 1512 1907 2315 2088 2746</text></svg>"}
    must_fail: [chart-plots-months]
  - id: months-swapped
    note: "puts May's and June's values on the wrong bars"
    files: {chart.svg: "<svg xmlns='http://www.w3.org/2000/svg'><rect width='5' height='5'/><text>Jan 1,284</text><text>Feb 1,512</text><text>Mar 1,907</text><text>Apr 2,315</text><text>May 2,746</text><text>Jun 2,088</text></svg>"}
    must_fail: [chart-plots-months]
  - id: text-only-svg
    note: "an SVG of month and value labels in order, with no bars or other marks"
    files: {chart.svg: "<svg xmlns='http://www.w3.org/2000/svg'><text>Jan 1,284</text><text>Feb 1,512</text><text>Mar 1,907</text><text>Apr 2,315</text><text>May 2,088</text><text>Jun 2,746</text></svg>"}
    must_fail: [chart-plots-months]
