wiki:
  pages:
    - id: pg1
      title: Churn signals
      space: Customer Success
      author: maya@lumenly.test
      created: "2026-03-02T10:00:00+00:00"
      updated: "2026-09-14T16:20:00+01:00"
      url: https://wiki.example/pages/pg1
      body: |-
        How we decide which renewals are at risk. Run this before each CS leads sync.

        An account is a churn risk when its renewal date falls within the next 60 days AND at least one of these is true:
        1. Payments: it has a failed charge from this calendar month (UK time) that is still unpaid. A failed charge is resolved once a later charge for the same invoice succeeds, or once Finance confirms it was paid another way; a retry that fails again is still unpaid. Failures from earlier months are already with Collections, so leave them out.
        2. Support: it has an urgent ticket that is still open or pending. Solved or closed tickets don't count, and neither do high, normal or low priority ones.
        3. Notice: the customer has told us in writing that they won't renew or will cut back.

        Renewal dates and ARR come from the Accounts base. Payment history is in Stripe, tickets are in Zendesk. Stripe and Zendesk use legal names and people's emails, so match on the account's domain.

        Share the list in #cs-leads: one line per account with its ARR, CSM, renewal date and which signal fired, then the total ARR at risk.
    - id: pg3
      title: Churn signals (2025 draft)
      space: Archive
      author: tom@lumenly.test
      created: "2025-02-10T10:00:00+00:00"
      updated: "2025-02-10T10:00:00+00:00"
      url: https://wiki.example/pages/pg3
      body: "SUPERSEDED by the Customer Success page 'Churn signals'. Old idea: flag any account with a support ticket of high priority or above in the last 90 days, regardless of renewal date."
