      The Q3 forecast is in the Q3 forecast sheet, in the same layout as Q2. I used the Forecast method page with the two changes agreed in #sales-ops: Verbal is weighted at 70% from Q3 (Ines settled on 70% after Marco's 60% proposal), and the old Negotiation copy of Summit Dental from the July import is left out (the Verbal copy counts).
      - Ana: weighted $605,000, commit $500,000
      - Ben: weighted $216,725, commit $182,500
      - Chen: weighted $552,400, commit $483,000
      - Dev: weighted $584,900, commit $500,000
      - Erin: weighted $193,350, commit $160,500
      - Total: weighted $2,152,375, commit $1,826,000
      I left out ten slipped deals (close date passed, no activity in 30 days) for owners to re-date: Slate Fitness, Ridge Capital, Yarrow Learning and Lotus Hotels (Dev); Wren Insurance and Falcon Logistics (Ben); Mosaic Learning, Saffron Retail, Cinder Analytics and Hazel Systems (Ana).
      The wiki page still says Verbal 80%; it needs updating to 70%.
