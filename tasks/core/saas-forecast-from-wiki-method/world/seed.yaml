wiki:
  pages:
    - id: pg1
      title: Forecast method
      space: Sales
      author: dana@quayside.test
      created: "2025-12-01T10:00:00+00:00"
      updated: "2026-04-02T09:15:00+01:00"
      url: https://wiki.example/pages/pg1
      body: |-
        How we build the quarterly forecast for the Monday sales meeting.

        Scope: deals in the Pipeline base whose Close date falls inside the calendar quarter (Q1 Jan-Mar, Q2 Apr-Jun, Q3 Jul-Sep, Q4 Oct-Dec). Closed Lost deals are out.

        Slipped deals: leave out any open deal whose Close date has already passed and that has had no activity in the last 30 days. Those need re-dating by their owner, not forecasting. Closed Won deals always count.

        Stage weights: Discovery 10%, Proposal 25%, Negotiation 50%, Verbal 80%, Closed Won 100%.

        Weighted pipeline = sum of Amount x stage weight over the deals in scope (Closed Won at 100%).
        Commit = Closed Won + Verbal deals in scope, at full Amount.

        Write one row per owner plus a Total row into that quarter's forecast sheet, in the same layout as last quarter's. Whole dollars.
    - id: pg2
      title: Forecast method (old)
      space: Archive
      author: dana@quayside.test
      created: "2025-01-10T10:00:00+00:00"
      updated: "2025-01-10T10:00:00+00:00"
      url: https://wiki.example/pages/pg2
      body: "Replaced by the Sales page 'Forecast method'. Old weights: Discovery 20%, Proposal 40%, Negotiation 60%, Verbal 90%. Commit was Verbal + Negotiation."
    - id: pg3
      title: Sales meeting agenda
      space: Sales
      author: dana@quayside.test
      created: "2026-01-05T10:00:00+00:00"
      updated: "2026-08-10T08:00:00+01:00"
      url: https://wiki.example/pages/pg3
      body: "Mondays 9:30. 1) Forecast walk-through by owner 2) Deals needing help 3) Slipped deals to re-date. Method tweaks and data fixes get agreed in #sales-ops."
