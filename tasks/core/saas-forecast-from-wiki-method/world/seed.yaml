    - {id: o1, channel: ch_ops, author: "marco@quayside.test", text: "Verbal deals keep slipping a quarter. Proposal: weight Verbal at 60% instead of 80% in the forecast, starting with Q3.", ts: "2026-07-01T16:10:00+01:00", thread_id: null}
    - {id: o2, channel: ch_ops, author: "ines@quayside.test", text: "Agree 80 is too high, but 60 is harsh. Let's settle on 70% for Verbal from the Q3 forecast on. Everything else in the method stays, commit included.", ts: "2026-07-02T09:05:00+01:00", thread_id: o1}
    - {id: o3, channel: ch_ops, author: "marco@quayside.test", text: "Fine, 70 it is. Dana, can you fold it into the wiki page when you get a minute?", ts: "2026-07-02T09:40:00+01:00", thread_id: o1}
    - {id: o4, channel: ch_ops, author: "sol@quayside.test", text: "Heads up: the July import made a second copy of Summit Dental in Pipeline. The Negotiation one is the old copy, the Verbal one is current. Leave the old copy out of anything you build until I delete it.", ts: "2026-08-06T14:22:00+01:00", thread_id: null}
