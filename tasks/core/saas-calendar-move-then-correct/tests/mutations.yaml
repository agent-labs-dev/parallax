mutations:
  - {id: nothing-moved, note: "claims the move but changes nothing", base: seed, must_fail: [friday-at-ten]}
  - {id: thursday-left-moved, note: "moves Friday but forgets to put Thursday back",
     patch: {update: {calendar.events: {e1: {exceptions: {"2026-05-25": {cancelled: true},
                                                         "2026-06-04": {start: "2026-06-04T10:00:00+01:00", end: "2026-06-04T10:15:00+01:00"},
                                                         "2026-06-05": {start: "2026-06-05T10:00:00+01:00", end: "2026-06-05T10:15:00+01:00"}}}}}},
     must_fail: [thursday-as-before]}
  - {id: thursday-cancelled, note: "cancels Thursday instead of restoring it",
     patch: {update: {calendar.events: {e1: {exceptions: {"2026-05-25": {cancelled: true}, "2026-06-04": {cancelled: true},
                                                         "2026-06-05": {start: "2026-06-05T10:00:00+01:00", end: "2026-06-05T10:15:00+01:00"}}}}}},
     must_fail: [thursday-as-before]}
  - {id: whole-series-moved, note: "moves every standup to 10:00",
     patch: {update: {calendar.events: {e1: {start: "2026-01-05T10:00:00+00:00", end: "2026-01-05T10:15:00+00:00"}}}},
     must_fail: [series-untouched]}
  - {id: friday-wrong-time, note: "moves Friday to 10 in the evening",
     patch: {update: {calendar.events: {e1: {exceptions: {"2026-05-25": {cancelled: true},
                                                         "2026-06-05": {start: "2026-06-05T22:00:00+01:00", end: "2026-06-05T22:15:00+01:00"}}}}}},
     must_fail: [friday-at-ten]}
  - id: one-off-copy
    note: "cancels nothing and books a separate 10:00 event"
    patch:
      insert:
        calendar.events:
          - {id: evt_99, calendar: cal-alex, title: "Team standup", start: "2026-06-05T10:00:00+01:00", end: "2026-06-05T10:15:00+01:00",
             tz: Europe/London, attendees: [priya@northwind.test], organizer: alex@northwind.test, rrule: null,
             exceptions: {}, status: confirmed, description: "", location: ""}
    must_fail: [no-new-events]
  - {id: moves-sprint-planning, note: "moves Friday's sprint planning instead", collateral: true,
     patch: {update: {calendar.events: {e3: {exceptions: {"2026-06-05": {start: "2026-06-05T10:00:00+01:00", end: "2026-06-05T11:00:00+01:00"}}}}}},
     must_fail: [other-events-untouched]}
