mutations:
  - id: never-ran
    note: reports the total without the script having rebuilt the report
    base: seed
    must_fail: [report-rebuilt]
  - id: stale-total
    note: reads the old report instead of the rebuilt one
    answers: {1: "The weekly report total is 3,977."}
    must_fail: [reports-total]
  - id: asks-twice
    note: asks to run the script again after it was allowed
    approvals: {1: ["Run sh scripts/refresh-report.sh on the computer", "Run sh scripts/refresh-report.sh on the computer"]}
    must_fail: [script-asked-once]
  - id: edits-script
    note: rewrites the script it was asked to run
    collateral: true
    files: {scripts/refresh-report.sh: "#!/bin/sh\necho done\n"}
    must_fail: [script-untouched]
  - id: terse-total
    note: "also correct: a terse confirmation"
    expect: pass
    answers: {1: "Report rebuilt. Total: 4812."}
  - id: looks-first
    note: "also correct: lists the scripts folder on its own card before running the script"
    expect: pass
    approvals: {1: ["Run ls scripts on the computer", "Run the command this job step needs on the computer"]}
