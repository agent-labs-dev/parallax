# Flags verified against codex-cli 0.169.0 (fixtures/codex/help.txt). `resume` accepts only the flags
# listed after it; -C is a parent `exec` option, so it precedes the subcommand. Config checked with
# `codex --strict-config`; `web_search = "disabled"` is the current top-level key.
protocol = "cli"
parser = "codex_jsonl"
session = "from_output"
stdin = "prompt"
argv_first = ["codex", "exec", "--json", "--skip-git-repo-check", "--dangerously-bypass-approvals-and-sandbox",
  "-m", "{model_name}", "-C", "{workspace}", "-"]
argv_next = ["codex", "exec", "-C", "{workspace}", "resume", "--json", "--skip-git-repo-check",
  "--dangerously-bypass-approvals-and-sandbox", "-m", "{model_name}", "{session}", "-"]
# TB2 (Harbor-style, agents/installed/codex.py at the pin): install as root in the owned task
# container (Node 22.14.0 from the official checksum file, pinned CLI 0.169.0 as above), then run inside
# it via docker exec with the manifest env passed per exec. {workspace} is /app in that container.
tb2_install = "set -eu; node_version=22.14.0; node_name=node-v$node_version-linux-x64.tar.xz; node_archive=/tmp/$node_name; tar -xJf \"$node_archive\" -C /opt; ln -sfn /opt/node-v$node_version-linux-x64 /opt/node; export PATH=\"/opt/node/bin:$PATH\"; ln -sfn /opt/node/bin/node /usr/local/bin/node; ln -sfn /opt/node/bin/npm /usr/local/bin/npm; ln -sfn /opt/node/bin/npx /usr/local/bin/npx; test \"$(node --version)\" = v22.14.0; package=/tmp/codex-0.169.0.tgz; platform=/tmp/codex-0.169.0-linux-x64.tgz; npm install -g \"$package\" \"@openai/codex-linux-x64@file:$platform\" --offline; ln -sf \"$(command -v codex)\" /usr/local/bin/codex; codex --version"
tb2_prerequisites = ["tar", "xz", "ln"]
tb2_artifacts = [
  { name = "node-v22.14.0-linux-x64.tar.xz", url = "https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz", digest = "69b09dba5c8dcb05c4e4273a4340db1005abeafe3927efda2bc5b249e80437ec" },
  { name = "codex-0.169.0.tgz", url = "https://registry.npmjs.org/@openai/codex/-/codex-0.169.0.tgz", algorithm = "sha512", digest = "KhzYlkKPxoNssR8CEm45IjqnFWn7UtlF4CiD3tOJPea51xBs7MaHy0UQG9GSbCqk6Lrjn5QdJDV0QD1/FgWlGw==" },
  { name = "codex-0.169.0-linux-x64.tgz", url = "https://registry.npmjs.org/@openai/codex/-/codex-0.169.0-linux-x64.tgz", algorithm = "sha512", digest = "o05NyAOCDygSPRo1yinzxvkRSdmsZyBD9E7mbpmjRanSfM8lypqWtQgEo4XfNkwhuCR2aFu8mlGOsQGFXVbVww==" },
]
tb2_argv_first = ["codex", "exec", "--json", "--skip-git-repo-check", "--dangerously-bypass-approvals-and-sandbox",
  "-m", "{model_name}", "-C", "{workspace}", "-"]
tb2_argv_next = ["codex", "exec", "-C", "{workspace}", "resume", "--json", "--skip-git-repo-check",
  "--dangerously-bypass-approvals-and-sandbox", "-m", "{model_name}", "{session}", "-"]

[info]
name = "codex"
kind = "open"
meter_wire = "openai"
# No `memory`: codex 0.169.0 ships `features.memories` off, extracts only rollouts idle for
# `memories.min_rollout_idle_hours`, and skips any rollout that used MCP (`no_memories_if_mcp_or_web_search`),
# which is every trial here. Codex therefore has no cross-session memory to measure, so memory tasks are NA.
capabilities = ["mcp", "workspace", "shell", "multi_turn", "live_container"]
pins_model = true
cost_source = "metered"
install = "npm i -g @openai/codex@0.169.0"
version_cmd = ["codex", "--version"]
web_disabled_by = "config"
source_url = "https://github.com/openai/codex"

[env]
CODEX_HOME = "{home}/.codex"
PARALLAX_METER_KEY = "{meter_key}"

[[config]]
path = "home:.codex/config.toml"
format = "toml"
content = { model_provider = "meter", web_search = "disabled", model_providers = { meter = { name = "meter", base_url = "{meter_openai}", env_key = "PARALLAX_METER_KEY", wire_api = "responses" } } }
mcp_content = { mcp_servers = { world = { url = "{world_url}", bearer_token_env_var = "{world_token_env}" } } }

