# A throwaway self-hosted Langfuse for the smoke suite, adapted from langfuse/langfuse's docker-compose.yml.
# No named volumes and no fixed host ports: `docker compose down` leaves nothing behind, and the stack never
# collides with a local Postgres or Redis. Secrets come from the environment, generated per run.
x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:${PARALLAX_LF_WEB_PORT:?}
  DATABASE_URL: postgresql://postgres:${PARALLAX_LF_PG_PASSWORD:?}@postgres:5432/postgres
  SALT: ${PARALLAX_LF_SALT:?}
  ENCRYPTION_KEY: ${PARALLAX_LF_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${PARALLAX_LF_CH_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${PARALLAX_LF_S3_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${PARALLAX_LF_S3_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${PARALLAX_LF_REDIS_PASSWORD:?}

x-depends: &depends
  postgres: {condition: service_healthy}
  minio: {condition: service_healthy}
  redis: {condition: service_healthy}
  clickhouse: {condition: service_healthy}

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.75.0
    depends_on: *depends
    environment: *langfuse-env

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.75.0
    depends_on: *depends
    ports:
      - 127.0.0.1:${PARALLAX_LF_WEB_PORT:?}:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${PARALLAX_LF_NEXTAUTH_SECRET:?}
      # Clients upload media straight to object storage, so they need its host-side address.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${PARALLAX_LF_S3_PORT:?}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: parallax
      LANGFUSE_INIT_ORG_NAME: parallax
      LANGFUSE_INIT_PROJECT_ID: parallax-smoke
      LANGFUSE_INIT_PROJECT_NAME: parallax-smoke
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${PARALLAX_LF_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${PARALLAX_LF_SECRET_KEY:?}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${PARALLAX_LF_CH_PASSWORD:?}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${PARALLAX_LF_S3_PASSWORD:?}
    ports:
      - 127.0.0.1:${PARALLAX_LF_S3_PORT:?}:9000
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 30

  redis:
    image: docker.io/redis:8.10.3
    command: --requirepass ${PARALLAX_LF_REDIS_PASSWORD:?} --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PARALLAX_LF_REDIS_PASSWORD:?}", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: docker.io/postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PARALLAX_LF_PG_PASSWORD:?}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
