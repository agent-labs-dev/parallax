checks:
  - id: camera-flyby
    kind: command
    mode: missing_action
    run:
      - python
      - -c
      - |
        import json
        from pathlib import Path
        report = json.loads(Path("scene_report.json").read_text())
        scene = report["scene"]
        assert scene["frame_start"] == 1, scene
        assert scene["frame_end"] == 96, scene
        frames = {sample["frame"]: sample for sample in report["samples"]}
        for frame, want in ((1, (-6.0, 0.0, 1.6)), (48, (0.0, 0.0, 1.6)), (96, (6.0, 0.0, 1.6))):
            got = frames[frame]["location"]
            assert max(abs(a - b) for a, b in zip(got, want)) <= 0.15, (frame, got)
        xs = [frames[frame]["location"][0] for frame in sorted(frames)]
        assert all(b > a for a, b in zip(xs, xs[1:])), xs
        shipped = Path("set_shipped.blend")
        assert shipped.is_file() and shipped.stat().st_size > 5000, shipped
  - id: tower-centred
    kind: command
    mode: wrong_output
    run:
      - python
      - -c
      - |
        import json
        import math
        from pathlib import Path
        report = json.loads(Path("scene_report.json").read_text())
        target = (0.0, 4.0, 2.5)
        limit = math.cos(math.radians(5.0))
        for sample in report["samples"]:
            if sample["frame"] not in (1, 48, 96):
                continue
            to_target = [t - l for t, l in zip(target, sample["location"])]
            length = math.sqrt(sum(v * v for v in to_target))
            aimed = sum(f * v for f, v in zip(sample["forward"], to_target)) / length
            assert aimed >= limit, (sample["frame"], aimed)
  - id: render-written
    kind: command
    mode: missing_action
    run:
      - python
      - -c
      - |
        import struct
        import zlib
        from pathlib import Path
        data = Path("renders/frame_0048.png").read_bytes()
        assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
        assert data[12:16] == b"IHDR", "no IHDR"
        width, height = struct.unpack(">II", data[16:24])
        assert (width, height) == (640, 360), (width, height)
        position, payload = 8, b""
        while position < len(data):
            length = struct.unpack(">I", data[position:position + 4])[0]
            if data[position + 4:position + 8] == b"IDAT":
                payload += data[position + 8:position + 8 + length]
            position += 12 + length
        raw = zlib.decompress(payload)
        assert len(raw) > 360 * (1 + 640 * 3) // 2, len(raw)
        assert sum(1 for byte in raw if byte) / len(raw) > 0.02, "uniform image"
  - id: towers-untouched
    kind: command
    mode: collateral_change
    run:
      - python
      - -c
      - |
        import json
        from pathlib import Path
        report = json.loads(Path("scene_report.json").read_text())
        seed = {
            "Ground": ((0.0, 0.0, 0.0), (40.0, 40.0, 0.0)),
            "Tower_A": ((-3.0, 4.0, 1.5), (1.0, 1.0, 3.0)),
            "Tower_B": ((0.0, 4.0, 2.5), (1.2, 1.2, 5.0)),
            "Tower_C": ((3.0, 4.0, 1.5), (1.0, 1.0, 3.0)),
        }
        objects = {obj["name"]: obj for obj in report["objects"]}
        for name, (location, dimensions) in seed.items():
            assert name in objects, f"{name} is gone"
            assert max(abs(a - b) for a, b in zip(objects[name]["location"], location)) <= 0.01, name
            assert max(abs(a - b) for a, b in zip(objects[name]["dimensions"], dimensions)) <= 0.01, name
  - id: report-hook-untouched
    kind: file
    mode: collateral_change
    path: scene_report.py
    unchanged: true
  - id: launcher-untouched
    kind: file
    mode: collateral_change
    path: blender_app.py
    unchanged: true
  - id: world-untouched
    kind: state
    mode: collateral_change
    table: '*'
    unchanged: true
    except_tables:
      - user.interactions
