version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    ignore:
      # The judge bridge tests meter the SDK version the pinned Online-Mind2Web judge installs (pyproject.toml).
      - dependency-name: openai
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ["*"]
